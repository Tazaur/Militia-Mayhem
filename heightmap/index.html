<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Height Painter</title>
<style>
:root { --bg: #111317; --panel: #1b1e24; --btn: #262a32; --on: #3d6df2; --tx: #e6e8ec; --dim: #8a909c; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); font: 14px system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
#app { display: flex; flex-direction: column; height: 100%; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.bar { display: flex; gap: 4px; padding: 3px 4px; background: var(--panel); align-items: center; flex-wrap: wrap; }
button, select { flex: none; height: 36px; min-width: 36px; padding: 0 8px; border: 0; border-radius: 7px; background: var(--btn); color: var(--tx); font: inherit; }
button.on { background: var(--on); }
button:active { filter: brightness(1.3); }
select { flex: 1; min-width: 120px; }
#views { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#views canvas { display: block; width: 100%; min-height: 0; touch-action: none; }
#v3 { flex: 0 0 40%; background: #0b0c0f; border-bottom: 1px solid #2c3038; }
#v2 { flex: 1; }
#views.only2 #v3, #views.only3 #v2 { display: none; }
#views.only3 #v3 { flex: 1; }
@media (orientation: landscape) { #views { flex-direction: row; } #v3 { flex: 0 0 45%; border-bottom: 0; border-right: 1px solid #2c3038; } #views canvas { height: 100%; } }
#val { flex: 1; min-width: 90px; }
.num { min-width: 34px; text-align: center; color: var(--tx); }
.lab { color: var(--dim); font-size: 12px; padding: 0 2px; flex: none; }
#status { color: var(--dim); font-size: 12px; padding: 0 4px; flex: none; min-width: 62px; text-align: right; }
#menu { position: fixed; right: 6px; top: calc(48px + env(safe-area-inset-top)); display: none; flex-direction: column; gap: 4px; padding: 6px; background: var(--panel); border-radius: 9px; box-shadow: 0 6px 24px #000a; z-index: 5; }
#menu.open { display: flex; }
#menu button { text-align: left; }
#toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); background: #000c; padding: 8px 14px; border-radius: 8px; pointer-events: none; opacity: 0; transition: opacity .3s; }
#info { position: fixed; pointer-events: none; font-size: 12px; color: var(--dim); background: #000a; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button id="prev">‹</button><select id="spr"></select><button id="next">›</button><span id="status"></span><button id="mnu">☰</button>
  </div>
  <div class="bar">
    <button id="chH" class="on">Height</button><button id="chR">Refl</button><button id="chE">Glow</button>
    <button id="ovl" class="on">Color</button><button id="msk" class="on">Mask</button><button id="lay">◧</button>
  </div>
  <div id="views"><canvas id="v3"></canvas><canvas id="v2"></canvas></div>
  <div class="bar">
    <span class="lab" id="selLab">Sprite</span>
    <button id="sUp">▲</button><button id="sDn">▼</button><button id="sFill">Fill</button><button id="sClr">Clear</button><button id="sNone">✕ Sel</button>
    <button id="undo">↶</button><button id="redo">↷</button>
  </div>
  <div class="bar" id="tools">
    <button data-t="pen" class="on">✎ Pen</button><button data-t="erase">⌫</button><button data-t="up">+1</button><button data-t="down">−1</button>
    <button data-t="fill">◍ Fill</button><button data-t="sel">⬚ Sel</button><button data-t="pick">⌖ Pick</button>
  </div>
  <div class="bar">
    <button id="vDn">−</button><input id="val" type="range" min="0" max="63" value="8"><button id="vUp">+</button><span class="num" id="vNum">8</span>
    <button id="size">□ 1</button><button id="tol">Tol 0</button>
  </div>
</div>
<div id="menu">
  <button id="mDl">Download atlas_m.png</button><button id="mShare">Share atlas_m.png</button><button id="mImp">Import PNG…</button>
  <button id="mRevS">Revert sprite to file</button><button id="mRevA">Revert everything to file</button>
</div>
<input id="file" type="file" accept="image/png" hidden>
<div id="toast"></div><div id="info"></div>
<script>
'use strict';
/* Material atlas painter for Militia Mayhem. The material atlas (atlas_m.png) has atlas.png's layout: R = height, 4 per voxel
   (0..63), G = reflectivity, B = glow. Paint on the 2D view, the 3D view shows each pixel as a column of voxels. Everything is
   kept in IndexedDB as you go; a new atlas layout (a repack) carries painted sprites over by name. */
const $ = id => document.getElementById(id);
const MAXV = [63, 255, 255], STEP = [1, 8, 8], SIZES = [1, 2, 3, 5, 8], TOLS = [[0, 1, 2, 4, 8], [0, 8, 16, 32, 64], [0, 8, 16, 32, 64]];
let W = 0, H = 0, META = {}, NAMES = [], COL = null, CH = null, FILE = null;
const st = { spr: '', ch: 0, tool: 'pen', prev: 'pen', val: [8, 100, 0], size: 0, tol: [1, 1, 1], ovl: true, mask: true, lay: 0 };
let sel = null;
try { Object.assign(st, JSON.parse(localStorage.getItem('hp-prefs') || '{}')); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem('hp-prefs', JSON.stringify(st)); } catch (e) {} };
const toast = (t) => { const e = $('toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.opacity = 0, 1600); };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------------- storage: IndexedDB, saved shortly after every change */
function db() { return new Promise((res, rej) => { const r = indexedDB.open('heightpainter', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function kv(k, v) {
  try {
    const d = await db();
    return await new Promise((res, rej) => { const s = d.transaction('kv', v === undefined ? 'readonly' : 'readwrite').objectStore('kv'), q = v === undefined ? s.get(k) : s.put(v, k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  } catch (e) { return null; }
}
let saveT = 0;
function changed() { $('status').textContent = '● unsaved'; clearTimeout(saveT); saveT = setTimeout(saveNow, 400); }
async function saveNow() { clearTimeout(saveT); const ok = await kv('work', { meta: META, w: W, h: H, ch: CH.map(a => a.slice()), t: Date.now() }); $('status').textContent = ok === null ? '⚠ not saved' : 'saved ✓'; }
addEventListener('visibilitychange', () => { if (document.hidden && $('status').textContent.startsWith('●')) saveNow(); });

/* ---------------- loading */
const fetchImg = async (url) => { const r = await fetch(url, { cache: 'no-cache' }); if (!r.ok) throw new Error(url + ' ' + r.status); return createImageBitmap(await r.blob()); };
function pixels(bm) { const c = document.createElement('canvas'); c.width = bm.width; c.height = bm.height; const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(bm, 0, 0); return g.getImageData(0, 0, bm.width, bm.height).data; }
function fromRGB(px) { const ch = [new Uint8Array(W * H), new Uint8Array(W * H), new Uint8Array(W * H)]; for (let i = 0; i < W * H; i++) { ch[0][i] = Math.min(63, Math.round(px[i * 4] / 4)); ch[1][i] = px[i * 4 + 1]; ch[2][i] = px[i * 4 + 2]; } return ch; }
function copyRect(dst, src, srcW, [sx, sy], [dx, dy, w, h]) { for (let c = 0; c < 3; c++) for (let y = 0; y < h; y++) dst[c].set(src[c].subarray((sy + y) * srcW + sx, (sy + y) * srcW + sx + w), (dy + y) * W + dx); }
async function load() {
  META = await (await fetch('../atlas.json', { cache: 'no-cache' })).json(); NAMES = Object.keys(META);
  const at = await fetchImg('../atlas.png'); W = at.width; H = at.height; COL = pixels(at);
  try { const m = await fetchImg('../atlas_m.png'); FILE = m.width === W && m.height === H ? fromRGB(pixels(m)) : null; } catch (e) { FILE = null; }
  if (!FILE) FILE = [new Uint8Array(W * H), new Uint8Array(W * H), new Uint8Array(W * H)];
  CH = FILE.map(a => a.slice());
  const s = await kv('work');
  if (s && s.ch) {
    if (s.w === W && s.h === H && JSON.stringify(s.meta) === JSON.stringify(META)) { CH = s.ch; toast('Restored your work'); }
    else { let n = 0; for (const k of NAMES) { const a = s.meta[k], b = META[k]; if (a && a[2] === b[2] && a[3] === b[3]) { copyRect(CH, s.ch, s.w, a, b); n++; } } toast('Atlas changed: carried ' + n + ' sprites over'); saveNow(); }
  }
  $('spr').innerHTML = '<option value="">— whole atlas —</option>' + NAMES.map(n => `<option>${n}</option>`).join('');
  if (st.spr && !META[st.spr]) st.spr = '';
  $('spr').value = st.spr; ui(); fit(); full2 = true; dirty3 = true;
}

/* ---------------- editing */
const rect = () => st.spr ? META[st.spr].slice(0, 4) : [0, 0, W, H];
function can(x, y) {
  const [rx, ry, rw, rh] = rect(); if (x < rx || y < ry || x >= rx + rw || y >= ry + rh) return false;
  if (sel && (x < sel[0] || y < sel[1] || x > sel[2] || y > sel[3])) return false;
  return !st.mask || COL[(y * W + x) * 4 + 3] > 0;
}
let stroke = null; const UNDO = [], REDO = [];
function begin() { stroke = { ch: st.ch, old: new Map() }; }
function put(i, v) { const a = CH[st.ch]; v = clamp(v, 0, MAXV[st.ch]); if (a[i] === v) return; if (!stroke.old.has(i)) stroke.old.set(i, a[i]); a[i] = v; touch(i); }
function end() {
  if (!stroke) return; const o = stroke.old;
  if (o.size) { const idx = Int32Array.from(o.keys()), old = Uint8Array.from(o.values()), nw = idx.map(i => CH[stroke.ch][i]); UNDO.push({ ch: stroke.ch, idx, old, nw: Uint8Array.from(nw) }); if (UNDO.length > 200) UNDO.shift(); REDO.length = 0; changed(); }
  stroke = null;
}
function cancel() { if (!stroke) return; for (const [i, v] of stroke.old) { CH[stroke.ch][i] = v; touch(i); } stroke = null; }
function history(from, to, key) { const e = from.pop(); if (!e) return; const a = CH[e.ch]; e.idx.forEach((i, k) => { a[i] = e[key][k]; touch(i); }); to.push(e); changed(); }
function touch(i) { if (!full2) paint2(i); dirty3 = true; }
function brush(x, y, f) { const s = SIZES[st.size], o = Math.floor((s - 1) / 2); for (let j = y - o; j < y - o + s; j++) for (let i = x - o; i < x - o + s; i++) if (can(i, j)) f(j * W + i); }
function apply(x, y) {
  const v = st.val[st.ch], a = CH[st.ch];
  if (st.tool === 'pen') brush(x, y, i => put(i, v));
  else if (st.tool === 'erase') brush(x, y, i => put(i, 0));
  else if (st.tool === 'up' || st.tool === 'down') brush(x, y, i => { if (!stroke.old.has(i)) put(i, a[i] + (st.tool === 'up' ? STEP[st.ch] : -STEP[st.ch])); });   // once per pixel per stroke
}
function flood(x, y) {
  if (!can(x, y)) return; const a = CH[st.ch], v0 = a[y * W + x], tol = TOLS[st.ch][st.tol[st.ch]], seen = new Uint8Array(W * H), q = [y * W + x]; seen[q[0]] = 1;
  while (q.length) {
    const i = q.pop(), px = i % W, py = (i - px) / W; put(i, st.val[st.ch]);
    for (const [nx, ny] of [[px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]]) { const j = ny * W + nx; if (can(nx, ny) && !seen[j] && Math.abs((stroke.old.has(j) ? stroke.old.get(j) : a[j]) - v0) <= tol) { seen[j] = 1; q.push(j); } }
  }
}
function bulk(f) {        // the selection, else the sprite (else the atlas)
  const [rx, ry, rw, rh] = rect(); begin();
  for (let y = ry; y < ry + rh; y++) for (let x = rx; x < rx + rw; x++) if (can(x, y)) f(y * W + x);
  end();
}

/* ---------------- 2D view */
const v2 = $('v2'), g2 = v2.getContext('2d'), buf = document.createElement('canvas'), bg = buf.getContext('2d');
let bd = null, full2 = true, z2 = 8, ox2 = 0, oy2 = 0, cur = null, need2 = true;
const TINT = [null, [90, 230, 255], [255, 150, 40]];
function paint2(i) {
  const v = CH[st.ch][i] / MAXV[st.ch], o = i * 4, al = COL[o + 3], d = bd.data; let r, g, b;
  if (st.ch && v > 0) { const t = TINT[st.ch]; r = 40 + t[0] * v * 0.85; g = 44 + t[1] * v * 0.85; b = 52 + t[2] * v * 0.85; }
  else [r, g, b] = ramp(CH[0][i]);
  if (!al) { if (v > 0) { r = 200 * v + 40; g = 30; b = 160 * v + 40; } else { r = 21; g = 23; b = 27; } }      // painted outside the art: magenta
  else if (st.ovl) { const k = 0.5; r = r * (1 - k) + COL[o] * k; g = g * (1 - k) + COL[o + 1] * k; b = b * (1 - k) + COL[o + 2] * k; }
  d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255; need2 = true;
}
function ramp(h) { if (h <= 24) { const t = h / 24; return [48 + 207 * t, 52 + 203 * t, 64 + 191 * t]; } const t = (h - 24) / 39; return [255, 255 - 105 * t, 255 - 215 * t]; }   // greys to 24 voxels, then to orange
function rebuild2() { if (buf.width !== W) { buf.width = W; buf.height = H; bd = bg.createImageData(W, H); } for (let i = 0; i < W * H; i++) paint2(i); full2 = false; }
function fit() {
  const [rx, ry, rw, rh] = rect(), cw = v2.clientWidth, chh = v2.clientHeight; if (!cw) return;
  z2 = Math.max(0.5, Math.min((cw - 16) / rw, (chh - 16) / rh)); if (z2 > 1) z2 = Math.floor(z2);
  ox2 = (cw - rw * z2) / 2 - rx * z2; oy2 = (chh - rh * z2) / 2 - ry * z2; need2 = true; fitCam();
}
function draw2() {
  const dpr = devicePixelRatio || 1, cw = v2.clientWidth, chh = v2.clientHeight;
  if (v2.width !== Math.round(cw * dpr) || v2.height !== Math.round(chh * dpr)) { v2.width = Math.round(cw * dpr); v2.height = Math.round(chh * dpr); }
  if (bd) bg.putImageData(bd, 0, 0);
  g2.setTransform(1, 0, 0, 1, 0, 0); g2.fillStyle = '#0d0e11'; g2.fillRect(0, 0, v2.width, v2.height); g2.setTransform(dpr, 0, 0, dpr, 0, 0);
  const [rx, ry, rw, rh] = rect(); g2.imageSmoothingEnabled = false;
  g2.drawImage(buf, rx, ry, rw, rh, ox2 + rx * z2, oy2 + ry * z2, rw * z2, rh * z2);
  if (z2 >= 10) {          // pixel grid on what's on screen
    const x0 = Math.max(rx, Math.floor(-ox2 / z2)), x1 = Math.min(rx + rw, Math.ceil((cw - ox2) / z2)), y0 = Math.max(ry, Math.floor(-oy2 / z2)), y1 = Math.min(ry + rh, Math.ceil((chh - oy2) / z2));
    g2.beginPath(); for (let x = x0; x <= x1; x++) { g2.moveTo(ox2 + x * z2 + 0.5, oy2 + y0 * z2); g2.lineTo(ox2 + x * z2 + 0.5, oy2 + y1 * z2); } for (let y = y0; y <= y1; y++) { g2.moveTo(ox2 + x0 * z2, oy2 + y * z2 + 0.5); g2.lineTo(ox2 + x1 * z2, oy2 + y * z2 + 0.5); }
    g2.strokeStyle = 'rgba(255,255,255,0.07)'; g2.lineWidth = 1; g2.stroke();
  }
  g2.lineWidth = 1;
  if (!st.spr) { g2.strokeStyle = 'rgba(120,140,255,0.25)'; for (const n of NAMES) { const m = META[n]; g2.strokeRect(ox2 + m[0] * z2 - 0.5, oy2 + m[1] * z2 - 0.5, m[2] * z2 + 1, m[3] * z2 + 1); } }
  else { g2.strokeStyle = 'rgba(120,140,255,0.6)'; g2.strokeRect(ox2 + rx * z2 - 0.5, oy2 + ry * z2 - 0.5, rw * z2 + 1, rh * z2 + 1); }
  if (sel) { g2.setLineDash([5, 4]); g2.strokeStyle = '#fff'; g2.strokeRect(ox2 + sel[0] * z2, oy2 + sel[1] * z2, (sel[2] - sel[0] + 1) * z2, (sel[3] - sel[1] + 1) * z2); g2.setLineDash([]); }
  if (cur) { const s = SIZES[st.size], o = Math.floor((s - 1) / 2), n = st.tool === 'fill' || st.tool === 'pick' || st.tool === 'sel' ? 1 : s; g2.strokeStyle = '#ff4fd8'; g2.strokeRect(ox2 + (cur[0] - (n > 1 ? o : 0)) * z2, oy2 + (cur[1] - (n > 1 ? o : 0)) * z2, n * z2, n * z2); }
  need2 = false;
}
function info() {
  const e = $('info'); if (!cur || !CH) { e.style.display = 'none'; return; }
  const i = cur[1] * W + cur[0], b = v2.getBoundingClientRect(); e.style.display = 'block'; e.style.left = (b.left + 6) + 'px'; e.style.top = (b.top + 6) + 'px';
  e.textContent = `${cur[0] - rect()[0]}, ${cur[1] - rect()[1]}   H ${CH[0][i]}  Refl ${CH[1][i]}  Glow ${CH[2][i]}`;
}
/* fingers: one paints, two pan / zoom (and take back what the first one started painting); mouse: wheel zooms, right / middle drag pans */
const P2 = new Map(); let pinch = null, painting = false, lastPx = null, hold = false;
const atPx = (x, y) => [Math.floor((x - ox2) / z2), Math.floor((y - oy2) / z2)];
const local = (e, c) => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
function startPinch(P) { const [a, b] = [...P.values()]; pinch = { z: z2, ox: ox2, oy: oy2, mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2, d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1 }; }
v2.addEventListener('contextmenu', e => e.preventDefault());
v2.addEventListener('pointerdown', e => {
  v2.setPointerCapture(e.pointerId); const p = local(e, v2); P2.set(e.pointerId, p);
  if (e.pointerType === 'mouse' && e.button) { pinch = { pan: true, ox: ox2, oy: oy2, mx: p[0], my: p[1] }; return; }
  if (P2.size === 2) { if (painting) { cancel(); painting = false; if (st.tool === 'sel') sel = selWas; } startPinch(P2); hold = true; return; }
  if (P2.size > 2 || hold) return;
  toolDown(atPx(...p));
});
v2.addEventListener('pointermove', e => {
  const p = local(e, v2); if (P2.has(e.pointerId)) P2.set(e.pointerId, p);
  if (pinch && pinch.pan) { ox2 = pinch.ox + p[0] - pinch.mx; oy2 = pinch.oy + p[1] - pinch.my; need2 = true; return; }
  if (pinch && P2.size >= 2) {
    const [a, b] = [...P2.values()], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, z = clamp(pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d, 0.3, 80);
    ox2 = mx - (pinch.mx - pinch.ox) * z / pinch.z; oy2 = my - (pinch.my - pinch.oy) * z / pinch.z; z2 = z; need2 = true; return;
  }
  const q = atPx(...p); if (e.pointerType === 'mouse' || painting) { cur = q; need2 = true; }
  if (painting) toolMove(q);
});
function up(e) {
  P2.delete(e.pointerId);
  if (painting && !P2.size) { toolUp(); painting = false; }
  if (P2.size < 2 && pinch) pinch = null;
  if (!P2.size) hold = false;
}
v2.addEventListener('pointerup', up); v2.addEventListener('pointercancel', up);
v2.addEventListener('wheel', e => { e.preventDefault(); const [x, y] = local(e, v2), z = clamp(z2 * Math.exp(-e.deltaY * 0.0015), 0.3, 80); ox2 = x - (x - ox2) * z / z2; oy2 = y - (y - oy2) * z / z2; z2 = z; need2 = true; }, { passive: false });
let selWas = null, selFrom = null;
function toolDown(q) {
  painting = true; cur = q; lastPx = q; need2 = true;
  if (st.tool === 'sel') { selWas = sel; selFrom = q; sel = null; return; }
  if (st.tool === 'pick') { const i = q[1] * W + q[0]; if (q[0] >= 0 && q[1] >= 0 && q[0] < W && q[1] < H) { st.val[st.ch] = CH[st.ch][i]; st.tool = st.prev; ui(); } painting = false; return; }
  begin();
  if (st.tool === 'fill') { flood(...q); end(); painting = false; return; }
  apply(...q);
}
function toolMove(q) {
  if (st.tool === 'sel') { const [rx, ry, rw, rh] = rect(), c = (v, a, n) => clamp(v, a, a + n - 1); sel = [c(Math.min(selFrom[0], q[0]), rx, rw), c(Math.min(selFrom[1], q[1]), ry, rh), c(Math.max(selFrom[0], q[0]), rx, rw), c(Math.max(selFrom[1], q[1]), ry, rh)]; if (sel[0] === sel[2] && sel[1] === sel[3] && q[0] === selFrom[0] && q[1] === selFrom[1]) sel = null; ui(); return; }
  let [x0, y0] = lastPx; const [x1, y1] = q, dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let er = dx + dy;
  for (;;) { if (x0 === x1 && y0 === y1) break; const e2 = 2 * er; if (e2 >= dy) { er += dy; x0 += sx; } if (e2 <= dx) { er += dx; y0 += sy; } apply(x0, y0); }
  lastPx = q;
}
function toolUp() { if (st.tool === 'sel') { ui(); return; } end(); }

/* ---------------- 3D view: one instanced box per pixel, as tall as its height; lines mark each voxel */
const v3 = $('v3'), gl = v3.getContext('webgl2', { antialias: true });
let prog, vao, ibuf, nInst = 0, dirty3 = true, need3 = true;

/* ---------------- UI */
function ui() {
  const ch = st.ch; $('chH').classList.toggle('on', ch === 0); $('chR').classList.toggle('on', ch === 1); $('chE').classList.toggle('on', ch === 2);

const setCh = c => { st.ch = c; full2 = true; dirty3 = true; ui(); };
$('chH').onclick = () => setCh(0); $('chR').onclick = () => setCh(1); $('chE').onclick = () => setCh(2);
$('ovl').onclick = () => { st.ovl = !st.ovl; full2 = true; dirty3 = true; ui(); };
$('msk').onclick = () => { st.mask = !st.mask; ui(); };

addEventListener('pointerdown', e => { if (!$('menu').contains(e.target) && e.target !== $('mnu')) $('menu').classList.remove('open'); });
