<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Militia Mayhem · Sound Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* the Sound Lab: design the game's synthesized sounds by ear. Plays them with the game's own code (../src/1c_sfx.js). */
:root{
  --bg:#0d120b;--panel:#1a2316;--panel2:#212c1c;--line:#2f3c28;--line2:#3d4d34;
  --ink:#ece4c8;--dim:#a49f86;--faint:#6f725f;--acc:#e0b72c;--acc2:#f5d670;--blue:#4c8dff;--red:#ef5a44;--green:#7ddc6a;--cyan:#5fd3d0;--violet:#b48cff;--orange:#ff9a3c;
  --fd:'Black Ops One',system-ui;--fb:'Chakra Petch',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace;color-scheme:dark
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;padding:calc(6px + env(safe-area-inset-top)) 16px 6px;background:var(--bg);border-bottom:1px solid var(--line)}
header .hr{display:flex;align-items:center;gap:8px;max-width:728px;margin:0 auto;position:relative}
#scope{max-width:728px;margin:6px auto 0}
header .btn.ic{width:30px;min-height:28px;font-size:12px;border-radius:8px}
header h1{font-family:var(--fd);font-weight:400;font-size:15px;margin:0;flex:none;min-width:0;line-height:1.1}
header #stats{flex:1;min-width:0;font-family:var(--fm);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:760px;margin:0 auto;padding:10px 16px 110px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 11px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);cursor:pointer;font-weight:600;font-size:13px;letter-spacing:.4px;white-space:nowrap}
.btn:disabled{opacity:.4}
.btn.on{background:var(--acc);color:#1a1405;border-color:var(--acc)}
.btn.sm{min-height:30px;padding:0 8px;font-size:12px;border-radius:8px}
.btn.ic{width:36px;padding:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>select{flex:1;min-width:0}
select,input[type=text],textarea{height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);padding:0 8px;min-width:0}
textarea{height:auto;width:100%;padding:8px;font-family:var(--fm);font-size:12px;resize:vertical}
h2{font-family:var(--fd);font-weight:400;font-size:15px;letter-spacing:.5px;margin:0 0 8px;color:var(--acc2);display:flex;align-items:center;gap:8px}
h2 .sp{flex:1}
.muted{color:var(--dim);font-size:12.5px}
.tag{font-family:var(--fm);font-size:11px;padding:2px 6px;border-radius:6px;background:var(--panel2);color:var(--dim)}
.tag.g{color:var(--green)}
/* sliders: label · track · value */
.sl{display:grid;grid-template-columns:118px 1fr 78px;align-items:center;gap:8px;min-height:34px}
.sl label{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl label input{vertical-align:-2px;margin:0 4px 0 0}
.sl .val{height:28px;width:100%;text-align:right;font-family:var(--fm);font-size:12px;border:1px solid transparent;background:transparent;border-radius:6px;padding:0 4px}
.sl .val:focus{border-color:var(--line2);background:var(--panel2);outline:none}
.sl select{height:30px;grid-column:2 / 4}
.sl.off input[type=range]{opacity:.3}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc);margin-top:-8px;border:2px solid var(--bg)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
details>summary{cursor:pointer;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);padding:6px 0;list-style:none}
details>summary::before{content:'▸ '}
details[open]>summary::before{content:'▾ '}
.grp{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);margin:8px 0 2px}
/* layers */
.ly{border-left:3px solid var(--c,var(--acc))}
.ly.mute{opacity:.5}
.lh{display:flex;align-items:center;gap:6px;margin:-2px 0 4px}
.lh b{font-family:var(--fd);font-weight:400;font-size:14px;color:var(--c)}
.lh .sum{flex:1;min-width:0;font-family:var(--fm);font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
/* the scope */
#wave{display:block;width:100%;height:76px;border-radius:10px;background:var(--panel2);cursor:pointer;touch-action:manipulation}
/* bottom bar: always in reach of a thumb */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
#play{flex:1;min-height:52px;font-family:var(--fd);font-size:20px;font-weight:400;background:var(--acc);color:#1a1405;border-color:var(--acc);letter-spacing:1px}
#play.run{background:var(--red);border-color:var(--red);color:#fff}
.menu{position:absolute;right:16px;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px;display:none;flex-direction:column;min-width:230px;box-shadow:0 8px 30px #0008}
.menu.open{display:flex}
.menu button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.menu button:active,.menu button:hover{background:var(--panel2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:14px;width:min(640px,calc(100vw - 32px));padding:14px}
dialog::backdrop{background:#000a}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
@media (max-width:420px){.sl{grid-template-columns:100px 1fr 72px;gap:6px}.btn.sm{padding:0 7px}}
</style>
</head>
<body>
<header><div class="hr">
  <h1>Sound Lab</h1><span class="muted" id="stats">…</span>
  <button class="btn ic" id="undo" title="Undo">↶</button><button class="btn ic" id="redo" title="Redo">↷</button>
  <button class="btn ic" id="mbtn" title="More">⋯</button>
  <div class="menu" id="menu">
    <button data-m="import">Import presets…</button>
    <button data-m="export">Export all for the game…</button>
    <button data-m="backup">Download library backup</button>
    <button data-m="restore">Open library backup…</button>
    <hr>
    <button data-m="sendall">Send all changed to game</button>
    <button data-m="clear">Remove all from game</button>
    <hr>
    <button data-m="reset">Reset library</button>
  </div></div>
  <div id="scope"><canvas id="wave" title="Tap to play"></canvas></div>
</header>
<main id="main"></main>
<div class="bar"><div class="in">
  <button class="btn" id="auto" title="Play on every change">AUTO</button>
  <button class="btn" id="loop" title="Repeat">LOOP</button>
  <button class="btn" id="play">▶ PLAY</button>
  <button class="btn" id="vary" title="Nudge every setting a little">VARY</button>
</div></div>
<dialog id="dlg"><h2 id="dt"></h2><p class="muted" id="dd"></p><textarea id="dx" rows="12" spellcheck="false"></textarea>
  <div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn" id="dcopy">Copy</button><button class="btn" id="dok">OK</button><button class="btn" id="dno">Close</button></div></dialog>
<input type="file" id="file" accept=".json,application/json,text/plain" hidden>
<div id="toast"></div>
<script src="../src/1c_sfx.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s), esc = t => String(t).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const clone = o => JSON.parse(JSON.stringify(o)), r4 = x => +(+x).toPrecision(4);
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1600); };

/* ---------- what can be edited ---------- */
const CATS = [['gun', 'Gunshots'], ['blast', 'Explosions & impacts'], ['metal', 'Metal'], ['engine', 'Engines'], ['horn', 'Horns'], ['ui', 'UI & pickups'], ['misc', 'Other']];
const GAME = ['rifle', 'br', 'pistol', 'mg', 'shotgun', 'sniper', 'cannon', 'whiz', 'boom', 'bigboom', 'rocket', 'crack', 'crush', 'crumble', 'splat', 'clang', 'clink', 'ting', 'glass', 'horn', 'ui', 'join', 'leave', 'ping', 'pickup', 'points', 'cap', 'lost', 'win', 'spawn', 'beep', 'hit', 'heal', 'reload', 'empty', 'throw', 'hurt', 'door', 'shuffle', 'rustle', 'torch', 'splash', 'drop', 'heat', 'jump', 'knife', 'thud'];
const ENGS = ['eng_tank', 'eng_car'];
const WAVES = ['sine', 'triangle', 'square', 'sawtooth'], FILTS = ['lowpass', 'highpass', 'bandpass', 'notch', 'peaking'];
// [label, min, max, log, unit, int] or [label, 'sel', options] / [label, 'chk']
const F = {
  d: ['Delay', 0, 2, 0, 's'], v: ['Level', 0, 1.5, 0, ''], a: ['Attack', 0.001, 1, 1, 's'], t: ['Decay', 0.005, 4, 1, 's'], dr: ['Distortion', 0, 8, 0, ''],
  n: ['Repeats', 1, 12, 0, '×', 1], dt: ['Repeat gap', 0.01, 1, 1, 's'], pm: ['Pitch / repeat', 0.5, 2, 1, '×'], vm: ['Level / repeat', 0.2, 1.5, 0, '×'], r: ['Random pitch', 0, 0.5, 0, '±'],
  w: ['Wave', 'sel', WAVES], f: ['Frequency', 20, 12000, 1, 'Hz'], f2: ['Sweep to', 10, 12000, 1, 'Hz', 0, 'sweep'], s: ['Sweep time', 0.05, 1.5, 0, '×'],
  ft: ['Filter', 'sel', [''].concat(FILTS)], fc: ['Filter cutoff', 20, 16000, 1, 'Hz'], q: ['Resonance', 0.1, 20, 1, ''],
  mr: ['FM ratio', 0.1, 12, 1, '×'], mi: ['FM depth', 0, 20, 0, ''], mi2: ['FM depth end', 0, 20, 0, ''],
  c: ['Grains', 1, 60, 0, '', 1], sp: ['Spread', 0.05, 3, 1, 's'], tr: ['Grain random', 0, 0.2, 0, 's']
};
const FX = {     // per layer type: label changes
  n: { f: ['Cutoff', 20, 16000, 1, 'Hz'], f2: ['Sweep cutoff', 10, 16000, 1, 'Hz', 0, 'sweep'], ft: ['Filter', 'sel', FILTS] },
  c: { f: ['Band low', 100, 12000, 1, 'Hz'], f2: ['Band high', 100, 12000, 1, 'Hz'], t: ['Grain length', 0.005, 0.2, 1, 's'] }
};
const G = {
  v: ['Volume', 0, 2, 0, ''], p: ['Pitch', 0.25, 4, 1, '×'], pr: ['Pitch random', 0, 0.3, 0, '±'], rv: ['Reverb', 0, 2, 0, ''], bs: ['Bass', -18, 18, 0, 'dB'],
  lp: ['Tone (cutoff)', 200, 20000, 1, 'Hz'], th: ['Throttle', 0, 300, 0, 'ms', 1], in: ['Music intensity', 0, 0.3, 0, ''], nd: ['Ignore distance', 'chk']
};
const E = {
  v: ['Volume', 0, 0.4, 0, ''], b: ['Idle pitch', 15, 200, 1, 'Hz'], sm: ['Rev range', 0, 4, 0, '×'], w1: ['Wave 1', 'sel', WAVES], w2: ['Wave 2', 'sel', WAVES], r2: ['Wave 2 ratio', 0.25, 4, 1, '×'], g2: ['Wave 2 level', 0, 1.5, 0, ''],
  lp: ['Filter idle', 50, 4000, 1, 'Hz'], lps: ['Filter opens by', 0, 4000, 0, 'Hz'], q: ['Resonance', 0.1, 20, 1, ''], dr: ['Distortion', 0, 8, 0, ''],
  sub: ['Sub freq', 15, 120, 1, 'Hz'], s0: ['Sub level', 0, 1, 0, ''], s1: ['Sub up close', 0, 1.5, 0, ''], ss: ['Sub follows speed', 0, 1, 0, ''],
  nf: ['Clatter band', 100, 6000, 1, 'Hz'], nq: ['Clatter Q', 0.1, 20, 1, ''], ng: ['Clatter level', 0, 1, 0, ''], l0: ['Clatter rate', 0.5, 30, 1, 'Hz'], l1: ['Rate + speed', 0, 40, 0, 'Hz'], lg: ['Clatter chop', 0, 1, 0, '']
};
const X = { dist: ['Distance', 0, 1, 0, ''], pan: ['Pan', -1, 1, 0, ''], sp: ['Speed', 0, 1, 0, ''], near: ['Player close', 0, 1, 0, ''] };
const LT = {   // layer types: name, colour, groups
  t: ['Tone', 'var(--acc)', [['', ['w', 'f', 'f2', 's', 'v', 'a', 't', 'dr']], ['Filter', ['ft', 'fc', 'q']], ['Timing & repeats', ['d', 'n', 'dt', 'pm', 'vm', 'r']]]],
  n: ['Noise', 'var(--cyan)', [['', ['ft', 'f', 'f2', 's', 'q', 'v', 'a', 't', 'dr']], ['Timing & repeats', ['d', 'n', 'dt', 'pm', 'vm', 'r']]]],
  f: ['FM', 'var(--violet)', [['', ['w', 'f', 'f2', 's', 'mr', 'mi', 'mi2', 'v', 'a', 't', 'dr']], ['Filter', ['ft', 'fc', 'q']], ['Timing & repeats', ['d', 'n', 'dt', 'pm', 'vm', 'r']]]],
  c: ['Crackle', 'var(--orange)', [['', ['c', 'sp', 'f', 'f2', 'q', 't', 'tr', 'v', 'd']]]]
};
const EG = [['Motor', ['v', 'b', 'sm', 'w1', 'w2', 'r2', 'g2']], ['Filter', ['lp', 'lps', 'q', 'dr']], ['Sub bass', ['sub', 's0', 's1', 'ss']], ['Track clatter', ['nf', 'nq', 'ng', 'l0', 'l1', 'lg']]];
const NEWL = { t: { k: 't', f: 220, f2: 80, s: 0.8, t: 0.2, v: 0.5 }, n: { k: 'n', f: 2000, f2: 200, t: 0.25, v: 0.4 }, f: { k: 'f', f: 600, mr: 1.41, mi: 4, mi2: 0, t: 0.5, v: 0.3 }, c: { k: 'c', c: 10, sp: 0.5, v: 0.2 } };

/* ---------- starting points: the game's own presets, plus the classic set's UI sounds and FM ideas ---------- */
const NAMES = { rifle: 'Rifle', br: 'Battle rifle', pistol: 'Pistol', mg: 'Machine gun', shotgun: 'Shotgun', sniper: 'Sniper', cannon: 'Tank cannon', whiz: 'Bullet whiz', boom: 'Explosion', bigboom: 'Big explosion', rocket: 'Rocket launch', crack: 'Wall crack', crush: 'Crush', splat: 'Hit splat', clang: 'Ricochet clang', eng_tank: 'Tank engine', eng_car: 'Vehicle engine' };
const CATOF = { rifle: 'gun', br: 'gun', pistol: 'gun', mg: 'gun', shotgun: 'gun', sniper: 'gun', cannon: 'gun', whiz: 'gun', boom: 'blast', bigboom: 'blast', rocket: 'blast', crack: 'blast', crush: 'blast', crumble: 'blast', splat: 'blast', clang: 'metal', clink: 'metal', ting: 'metal', glass: 'metal', horn: 'horn', eng_tank: 'engine', eng_car: 'engine', ui: 'ui', join: 'ui', leave: 'ui', ping: 'ui', pickup: 'ui', points: 'ui', cap: 'ui', lost: 'ui', win: 'ui', spawn: 'ui', beep: 'ui', hit: 'ui', heal: 'ui' };
const sq = (f, t, v, d, f2) => Object.assign({ k: 't', w: 'square', f, t, v, a: 0.005 }, d ? { d } : {}, f2 ? { f2 } : {});
const TPL = [
  ['Horn (classic)', 'horn', 'horn', { L: [sq(392, 0.28, 0.09), sq(494, 0.28, 0.07)] }],
  ['Air horn', 'horn', 'horn', { rv: 0.4, L: [{ k: 't', w: 'sawtooth', f: 220, a: 0.03, t: 0.7, v: 0.16, ft: 'lowpass', fc: 1800, q: 2, dr: 1.4 }, { k: 't', w: 'sawtooth', f: 277, a: 0.03, t: 0.7, v: 0.12, ft: 'lowpass', fc: 1800, q: 2, dr: 1.4 }] }],
  ['Truck horn (FM)', 'horn', 'horn', { rv: 0.3, L: [{ k: 'f', w: 'sawtooth', f: 165, mr: 1, mi: 1.5, mi2: 0.8, a: 0.02, t: 0.6, v: 0.2, ft: 'lowpass', fc: 1400, q: 3 }] }],
  ['Menu click', 'ui', 'ui', { L: [sq(700, 0.04, 0.05, 0, 1000)] }],
  ['Player join', 'ui', 'join', { L: [sq(440, 0.08, 0.08), sq(880, 0.14, 0.08, 0.07)] }],
  ['Player leave', 'ui', 'leave', { L: [sq(600, 0.12, 0.07, 0, 300)] }],
  ['Ping', 'ui', 'ping', { L: [{ k: 't', f: 1568, t: 0.12, v: 0.06 }, { k: 't', f: 2093, t: 0.18, v: 0.05, d: 0.08 }] }],
  ['Pickup', 'ui', 'pickup', { L: [{ k: 't', f: 660, t: 0.12, v: 0.12 }, { k: 't', f: 880, t: 0.12, v: 0.12, d: 0.06 }, { k: 't', f: 1320, t: 0.12, v: 0.12, d: 0.12 }] }],
  ['Flag captured', 'ui', 'cap', { L: [sq(523, 0.14, 0.08), sq(659, 0.14, 0.08, 0.12), sq(784, 0.14, 0.08, 0.24), sq(1047, 0.5, 0.08, 0.36)] }],
  ['Round won', 'ui', 'win', { L: [sq(392, 0.3, 0.08), sq(523, 0.3, 0.08, 0.15), { k: 't', w: 'square', f: 659, a: 0.005, t: 0.3, v: 0.08, d: 0.3, n: 2, dt: 0.15, pm: 1.19 }, sq(659, 0.3, 0.08, 0.6), sq(784, 0.3, 0.08, 0.75)] }],
  ['Hit marker', 'ui', 'hit', { L: [sq(1400, 0.03, 0.06, 0, 900)] }],
  ['Heal', 'ui', 'heal', { L: [{ k: 't', f: 880, f2: 1320, t: 0.15, v: 0.05 }] }],
  ['Reload', 'misc', 'reload', { L: [sq(900, 0.03, 0.06), sq(600, 0.04, 0.07, 0.25), sq(1100, 0.03, 0.07, 1)] }],
  ['Glass break', 'metal', 'glass', { th: 70, L: [{ k: 'n', ft: 'highpass', f: 4200, t: 0.22, v: 0.22 }, { k: 't', w: 'triangle', f: 3900, f2: 2400, t: 0.05, v: 0.06, n: 4, dt: 0.035, r: 0.33 }] }],
  ['Metal ping (FM)', 'metal', 'ting', { rv: 0.3, th: 45, L: [{ k: 'f', f: 2400, mr: 1.41, mi: 2.5, mi2: 0, a: 0.001, t: 0.5, v: 0.22, r: 0.04 }, { k: 'n', ft: 'highpass', f: 5000, t: 0.012, v: 0.2 }] }],
  ['Heavy clang (FM)', 'metal', 'clang', { rv: 0.4, th: 70, L: [{ k: 'f', f: 520, mr: 2.76, mi: 6, mi2: 0.5, a: 0.001, t: 0.8, v: 0.3, r: 0.03 }, { k: 'f', f: 1310, mr: 1.41, mi: 3, a: 0.001, t: 0.4, v: 0.18, r: 0.03 }, { k: 'n', ft: 'highpass', f: 3000, t: 0.02, v: 0.45 }] }],
  ['Bell (FM)', 'metal', 'ping', { rv: 0.6, L: [{ k: 'f', f: 880, mr: 3.5, mi: 4, mi2: 0, a: 0.002, t: 1.5, v: 0.15 }] }],
  ['Blank', 'misc', 'beep', { L: [{ k: 't', f: 440, t: 0.2, v: 0.3 }] }]
];
const builtin = b => clone(SFXD[b] || ENGD[b]);
function seed() {
  const lib = [];
  for (const b of Object.keys(SFXD).concat(ENGS)) lib.push({ id: 'g_' + b, nm: NAMES[b] || b, cat: CATOF[b] || 'misc', gn: b, b, P: builtin(b) });
  for (const [nm, cat, gn, P] of TPL) lib.push(mk(nm, cat, gn, clone(P)));
  return lib;
}
function uid() { return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ---------- state, kept in this browser across visits ---------- */
const KEY = 'mmsfx.lab';
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { }
if (!S || !Array.isArray(S.lib)) S = { lib: seed(), cur: 'g_rifle', cmp: '', auto: true, loop: false, X: { dist: 0, pan: 0, sp: 0.5, near: 0 } };
for (const b of Object.keys(SFXD).concat(ENGS)) if (!S.lib.some(p => p.b === b)) S.lib.push({ id: 'g_' + b, nm: NAMES[b] || b, cat: CATOF[b] || 'misc', gn: b, b, P: builtin(b) });   // new in the game since last visit
let pinB = null;                 // a snapshot to compare against (this visit only)
const cur = () => S.lib.find(p => p.id === S.cur) || S.lib[0];
const save = () => { clearTimeout(save.t); save.t = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save: storage full?'); } }, 250); };
/* undo: snapshots of the library */
const H = { a: [], i: -1 };
function commit() { const s = JSON.stringify({ lib: S.lib, cur: S.cur }); if (H.a[H.i] === s) return; H.a.length = H.i + 1; H.a.push(s); if (H.a.length > 80) H.a.shift(); H.i = H.a.length - 1; save(); undoUI(); }

    case 'ren': { const n = prompt('Name', cur().nm); if (n) { cur().nm = n.trim() || cur().nm; render(); commit(); } return; }
    case 'del': { if (!confirm('Delete "' + cur().nm + '"?')) return; engOff(); S.lib = S.lib.filter(q => q !== cur()); S.cur = S.lib[0].id; render(); commit(); return; }
    case 'rev': { if (!confirm('Put "' + cur().nm + '" back to the game\'s version?')) return; engOff(); cur().P = builtin(cur().b); render(); done(true); return; }
    case 'pin': pinB = clone(P); S.cmp = '#pin'; render(); toast('Pinned: compare your edits against it with ▶ B'); return;
    case 'pb': return playB();
    case 'pab': return playAB();
    case 'rev2': return revUp();
    case 'cp': return copy(code(cur()) + ',');
    case 'send': { const g = gameGet(); g[cur().gn] = pack(P); gameSet(g); render(); toast('The game now plays this for ' + cur().gn); return; }
    case 'unsend': { const g = gameGet(); delete g[cur().gn]; gameSet(g); render(); toast('Removed: the game plays its own ' + cur().gn); return; }
  }
});
function addPreset(src, suf) { const q = mk(src.nm + suf, src.cat, src.gn, clone(src.P)); S.lib.splice(S.lib.indexOf(src) + 1, 0, q); engOff(); S.cur = q.id; render(); commit(); toast('Made "' + q.nm + '"'); }
/* a layer changed to another type keeps its timing, level and pitch */
function retype(i, k) { const P = cur().P, L = P.L[i], keep = { d: L.d, v: L.v, _a: 1 }; if (k !== 'c' && L.k !== 'c') Object.assign(keep, { f: L.f, f2: L.f2, a: L.a, t: L.t }); P.L[i] = Object.assign(clone(NEWL[k]), JSON.parse(JSON.stringify(keep))); render(); done(true); }
function revUp() { if (!ENG) engOn(cur().P); const t0 = performance.now(); rev = t0; const st = () => { if (rev !== t0 || !ENG) return; const u = (performance.now() - t0) / 3000; if (u >= 1) { S.X.sp = 0.05; engTick(); render(); return; } S.X.sp = r4(Math.sin(u * Math.PI)); engTick(); requestAnimationFrame(st); }; st(); }
/* nudge every number a little: quick variations to try */
function vary() {
  const p = cur(), P = p.P, nud = (o, D, sp, keys) => { for (const k of keys) { const s = sp(k); if (!s || typeof s[1] !== 'number' || s[5]) continue; const v = o[k] !== undefined ? o[k] : D[k]; if (typeof v !== 'number' || v === 0) continue; o[k] = r4(Math.max(s[1], Math.min(s[2], v * (1 + (Math.random() * 2 - 1) * 0.15)))); } };
  if (P.e) nud(P, SFXK.e, k => E[k], Object.keys(E));
  else for (const L of P.L) nud(L, SFXK[L.k], k => (FX[L.k] && FX[L.k][k]) || F[k], Object.keys(SFXK[L.k]).filter(k => !['d', 'n', 'c'].includes(k)));
  render(); commit(); if (!P.e) play();
}
async function copy(t) { try { await navigator.clipboard.writeText(t); toast('Copied'); } catch (e) { dlg('Copy this', '', t); } }

/* ---------- dialogs and the ⋯ menu ---------- */
function dlg(title, desc, text, ok) {
  const d = $('#dlg'); $('#dt').textContent = title; $('#dd').textContent = desc; $('#dx').value = text || ''; $('#dx').readOnly = !ok;
  $('#dok').style.display = ok ? '' : 'none'; $('#dcopy').style.display = ok ? 'none' : '';
  $('#dok').onclick = () => { if (ok($('#dx').value) !== false) d.close(); };
  d.showModal ? d.showModal() : d.setAttribute('open', '');
}
$('#dno').onclick = () => $('#dlg').close(); $('#dcopy').onclick = () => copy($('#dx').value);
/* reads presets from: a library backup, { name: preset, … }, or lines "name: { … }," as exported */
function parseAny(t) {
  t = t.trim().replace(/,\s*$/, '');
  try { return JSON.parse(t); } catch (e) { }
  if (!/^[{\w'"]/.test(t)) throw new Error('not presets');
  return Function('"use strict";return (' + (t[0] === '{' ? t : '{' + t + '}') + ')')();
}
function importPresets(t) {
  let o; try { o = parseAny(t); } catch (e) { toast('Could not read that'); return false; }
  if (o && Array.isArray(o.lib)) { S.lib = o.lib; S.cur = o.lib[0].id; engOff(); render(); commit(); toast('Library opened'); return; }
  let n = 0;
  for (const gn in o) { const P = o[gn]; if (!P || (!P.e && !Array.isArray(P.L))) continue; const q = mk((NAMES[gn] || gn) + ' (imported)', P.e ? 'engine' : CATOF[gn] || 'misc', gn, P); q.o = ''; S.lib.push(q); S.cur = q.id; n++; }
  if (!n) { toast('No presets in that'); return false; }
  engOff(); render(); commit(); toast(n + ' imported');
}
$('#mbtn').onclick = e => { e.stopPropagation(); $('#menu').classList.toggle('open'); };
document.addEventListener('click', () => $('#menu').classList.remove('open'));
$('#menu').addEventListener('click', e => {
  const m = e.target.dataset.m; if (!m) return;
  const ch = S.lib.filter(changed);
  if (m === 'import') dlg('Import presets', 'Paste exported lines (name: { … },) or JSON.', '', importPresets);
  if (m === 'export') { const per = {}; for (const p of ch) per[p.gn] = p; const L = Object.values(per); dlg('Changed sounds, ready for the game', L.length ? 'One line per game sound (if two presets play as the same sound, the last one). Paste into SFXD / ENGD in src/1c_sfx.js, or send to Claude.' : 'Nothing differs from the game yet.', L.map(p => code(p) + ',').join('\n')); }
  if (m === 'backup') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ lab: 1, lib: S.lib })], { type: 'application/json' })); a.download = 'sound-lab-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
  if (m === 'restore') $('#file').click();
  if (m === 'sendall') { const g = gameGet(); for (const p of ch) g[p.gn] = pack(p.P); gameSet(g); render(); toast(ch.length + ' sent to the game'); }
  if (m === 'clear') { gameSet({}); render(); toast('The game plays its own sounds again'); }
  if (m === 'reset' && confirm('Reset the library to the game\'s sounds? Your presets are lost (undo still works this visit).')) { engOff(); S.lib = seed(); S.cur = 'g_rifle'; S.cmp = ''; render(); commit(); }
  $('#menu').classList.remove('open');
});
$('#file').onchange = async e => { const f = e.target.files[0]; if (f) importPresets(await f.text()); e.target.value = ''; };
$('#undo').onclick = () => hist(-1); $('#redo').onclick = () => hist(1);
$('#play').onclick = () => play();
$('#auto').onclick = () => { S.auto = !S.auto; $('#auto').classList.toggle('on', S.auto); save(); };
$('#loop').onclick = () => { S.loop = !S.loop; $('#loop').classList.toggle('on', S.loop); save(); if (S.loop) play(); else clearTimeout(loopT); };
$('#vary').onclick = vary;
$('#wave').onclick = () => play();
addEventListener('keydown', e => { if (e.target.closest('input,textarea,select')) return; if (e.code === 'Space') { e.preventDefault(); play(); } if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { e.preventDefault(); hist(e.shiftKey ? 1 : -1); } });
addEventListener('resize', wave);
document.addEventListener('visibilitychange', () => { if (document.hidden) { engOff(); clearTimeout(loopT); } });
render(); commit();
</script>
