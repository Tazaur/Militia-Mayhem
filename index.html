const TAU = Math.PI * 2;

function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; }
function prune(arr, f) { let j = 0; for (let i = 0; i < arr.length; i++) { const o = arr[i]; if (f(o)) arr[j++] = o; } arr.length = j; }
