<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame Pipeline</title>
<style>
:root {
  --bg: #101410; --panel: #171d17; --panel2: #1e261e; --line: #2c372c; --ink: #e8eadf; --dim: #9aa494; --faint: #6c7668;
  --acc: #e8c45a; --acc2: #6fc3d8; --good: #7fd16b; --bad: #ef6b5b; --gpu: #b48cf0; --cpu: #6fc3d8; --paint: #e8c45a; --fx: #f09a5a; --los: #7fd16b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 19px; letter-spacing: .02em; }
header .sub { color: var(--dim); font-size: 13px; }
header a { color: var(--acc2); font-size: 13px; margin-left: auto; }
#app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 52px); }
#steps { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 0; padding: 8px 0 40px; }
.ph { padding: 12px 14px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--faint); display: flex; align-items: center; gap: 8px; }
.ph i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.st { display: flex; gap: 8px; align-items: baseline; padding: 5px 14px 5px 18px; cursor: pointer; color: var(--dim); font-size: 13.5px; border-left: 3px solid transparent; }
.st:hover { background: var(--panel); color: var(--ink); }
.st.on { background: var(--panel2); color: var(--ink); border-left-color: var(--acc); }
.st .n { font-variant-numeric: tabular-nums; color: var(--faint); font-size: 11px; min-width: 22px; }
.st .nc { color: var(--faint); font-size: 11px; margin-left: auto; }
main { padding: 14px 18px 60px; min-width: 0; }
#bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
button { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 13px; font: inherit; font-size: 14px; cursor: pointer; }
button:hover { border-color: var(--acc); }
button.pri { background: var(--acc); color: #1b1a10; border-color: var(--acc); font-weight: 600; }
#slider { flex: 1; min-width: 140px; accent-color: var(--acc); }
#pos { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; min-width: 64px; text-align: right; }
.tog { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; cursor: pointer; user-select: none; }
.tog input { accent-color: var(--acc); }
#stage { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
#stage.two { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
.view { background: #050705; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; position: relative; }
.view .cap { position: absolute; left: 0; top: 0; right: 0; padding: 6px 10px; font-size: 12px; color: var(--ink); background: linear-gradient(#000c, #0000); pointer-events: none; display: flex; gap: 8px; }
.view .cap b { font-weight: 600; }
.view .cap span { color: var(--dim); }
.view .wrap { position: relative; aspect-ratio: 16 / 9; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.view .legend { padding: 6px 10px 8px; font-size: 12px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 14px; border-top: 1px solid var(--line); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
#info { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.card h2 { margin: 0 0 2px; font-size: 18px; }
.card .tag { display: inline-block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; margin-bottom: 8px; color: #111; font-weight: 700; }
.card p { margin: 8px 0; color: #d6d9cd; }
.card h3 { margin: 14px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); }
.card ul { margin: 6px 0; padding-left: 18px; color: #d6d9cd; }
.card code { background: #0b0e0b; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; color: var(--acc); }
.dec { width: 100%; border-collapse: collapse; font-size: 13px; }
.dec td, .dec th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.dec th { color: var(--faint); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
.yes { color: var(--good); font-weight: 600; } .no { color: var(--bad); font-weight: 600; }
svg.dg { width: 100%; height: auto; display: block; background: #0b0e0b; border-radius: 6px; margin-top: 4px; }
svg.dg text { fill: #cfd3c6; font: 11px system-ui, sans-serif; }
svg.dg .sm { font-size: 9.5px; fill: #9aa494; }
#load { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; z-index: 5; text-align: center; padding: 20px; }
#load .msg { color: var(--dim); }
#load .bar { width: 260px; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
#load .bar div { height: 100%; width: 0; background: var(--acc); transition: width .2s; }
#game { position: fixed; left: 0; top: 0; width: 1280px; height: 720px; border: 0; opacity: 0; pointer-events: none; z-index: -1; }
#mstep { display: none; width: 100%; margin-bottom: 8px; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 8px; font: inherit; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
@media (max-width: 980px) {
  #app { grid-template-columns: 1fr; }
  #steps { display: none; }
  #mstep { display: block; }
  #stage.two, #info { grid-template-columns: 1fr; }
  main { padding: 12px 12px 60px; }
}
</style>
</head>
<body>
<header>
  <h1>Frame Pipeline</h1>
  <span class="sub">Militia Mayhem · one real frame, drawn step by step · <span id="ver"></span></span>
  <a href="../">Play the game</a>
</header>
<div id="app">
  <nav id="steps"></nav>
  <main>
    <select id="mstep"></select>
    <div id="bar">
      <button id="first" title="Back to the blank slate">⏮</button>
      <button id="prev" title="Previous step (←)">◀ Prev</button>
      <button id="next" class="pri" title="Next step (→)">Next ▶</button>
      <button id="play" title="Play through">▶ Play</button>
      <input id="slider" type="range" min="0" max="0" value="0">
      <span id="pos"></span>
    </div>
    <div id="bar2" style="display:flex;gap:16px;flex-wrap:wrap;margin:-2px 0 10px">
      <label class="tog"><input type="checkbox" id="tChange" checked> Highlight what this step changed</label>
      <label class="tog"><input type="checkbox" id="tSight"> Show line of sight &amp; decisions</label>
      <button id="recap" style="padding:3px 10px;font-size:12px">Recapture frame</button>
    </div>
    <div id="stage">
      <div class="view" id="vFrame"><div class="wrap"><canvas id="cFrame"></canvas><canvas id="cOver"></canvas></div><div class="cap"><b>The frame so far</b><span id="capF"></span></div><div class="legend" id="lgF"></div></div>
      <div class="view" id="vAux" hidden><div class="wrap"><canvas id="cAux"></canvas></div><div class="cap"><b id="capAT"></b><span id="capA"></span></div><div class="legend" id="lgA"></div></div>
    </div>
    <div id="info">
      <div class="card" id="explain"></div>
      <div class="card" id="side"></div>
    </div>
  </main>
</div>
<div id="load"><div style="font-size:18px">Building the frame…</div><div class="msg" id="lmsg">Starting the game engine</div><div class="bar"><div id="lbar"></div></div></div>
<iframe id="game" title="game engine (hidden)" src="../index.html?pipeline"></iframe>
<script>
'use strict';
/* ================= the steps' meaning ================= */
const PH = {
  prep: ['Prepare', 'var(--cpu)'], paint: ['Paint the world (colour only)', 'var(--paint)'], gpu: ['Light & shadow (graphics chip)', 'var(--gpu)'],
  fx: ['Effects above the light', 'var(--fx)'], los: ['Line-of-sight overlay', 'var(--los)'], top: ['Labels & HUD', 'var(--acc2)']
};
const TAGC = { CPU: 'var(--cpu)', PAINT: 'var(--paint)', GPU: 'var(--gpu)', BLEND: 'var(--fx)', 'OFF-SCREEN': 'var(--los)' };
const Q_TXT = {
  crate: ['Crates', 'Supply crates. A crate is 10 px tall, so it’s painted early: anything taller covers it.'],
  item: ['Pickups', 'Medkits, ammo boxes, mines and pouches lying on the ground.'],
  brass: ['Spent brass', 'Ejected shell casings: tiny, flat, painted near the bottom of the stack.'],
  body: ['Bodies', 'Fallen soldiers.'],
  soldier: ['Soldiers', 'Each soldier is painted at its height (a standing man is taller than a prone one). <b>Decision:</b> a soldier is painted only if it, or its shadow, reaches what you can see. Anything further out is skipped entirely: never painted, no shadow, no cost. A soldier half out of sight is painted whole; the memory covers the hidden half at the end.'],
  sandbags: ['Sandbag walls', 'The curved sandbag arcs. These are remembered, so the memory picture keeps them too.'],
  fence: ['Fences', 'Fence posts and rails.'], hay: ['Hay bales', 'Round hay bales, 14 px tall.'],
  tree: ['Trees', 'Trees are tall (56 px canopy), so they come late and cover the low things under them.'],
  wreck: ['Wrecks', 'Burnt-out vehicles. Remembered, like scenery.'],
  vehicle: ['Vehicles', 'Each vehicle is painted in one piece: hull, crew, turret, gun. <b>Decision:</b> same as soldiers. A vehicle counts as a set of body circles, and it’s painted if any circle, or the shadow from it, reaches your sight. The jeep here is half in sight, so it’s painted whole.'],
  shot: ['Bullets & grenades', 'Tracers and thrown grenades in flight.'],
  'thrown body': ['Thrown bodies', 'Soldiers flung by explosions, painted higher as they rise.'],
  roofs: ['Roofs', 'Building roofs, 40 px up. Roofs are always known to everyone, so the line-of-sight overlay leaves a hole for them too.'],
  'killer glow': ['Killer highlight', 'The glow on whoever killed you. Painted after the light, so the shade can’t dim it.'],
  'flat shadows': ['Flat shadows', 'Used only with sunlight off: one simple offset shadow per unit.'],
};
const qName = k => k && k.startsWith('particles') ? ['Particles · ' + k.split('· ')[1], 'Dust, debris, sparks or blood of one kind, all in one batch. Low ones are painted with the objects; glowing ones after the light.'] : Q_TXT[k] || [k || 'Other', ''];

const STEP = {
  clear: s => ({ ph: 'prep', tag: 'PAINT', t: 'Blank slate', d: [
    'The game wipes this view’s rectangle to the dark field colour. Everything after this is painted on top, in order, like layers of paint. Nothing here is real 3D: the world is a flat picture, and depth, light and shadow are layered on with the tricks in the steps that follow.'] }),
  memory: s => ({ ph: 'prep', tag: 'CPU', t: 'What you can see, and what you remember', dg: 'sight', aux: 'Memory picture (off-screen)', d: [
    'Before painting anything, the game works out <b>what you can see</b>. From each eye (your soldier) it casts a line toward every wall corner. Where the lines are stopped by walls, it builds a <b>sight polygon</b>: the exact shape of what’s visible. Tick “Show line of sight” to see it.',
    'It also updates the <b>memory</b>, a separate picture of the map holding the ground as you last saw it. Shown on the right, the memory is greyed out. It holds only things that don’t move: ground, roofs, trees, hay, fences, sandbags, wrecks. People and vehicles are never in it.',
    'That memory isn’t on screen yet. It’s laid over everything at the very end, with a hole cut where you can see.'],
    why: 'Doing sight first means every later step can ask one question: “is this in sight?”' }),
  ground: s => ({ ph: 'paint', tag: 'PAINT', t: 'Ground, decals, footprints', d: [
    'The ground is one big pre-painted image of the whole map (grass, roads, fields). Only the part in view is copied. Then two more layers: <b>decals</b> (craters, scorch marks, blood) and <b>footprints/tyre tracks</b>, which slowly fade.',
    'This is drawn for the whole view, even the parts you can’t see. Nothing is cut out while painting; the memory covers the unseen parts at the end. That keeps every step simple and the same everywhere.'] }),
  flags: s => ({ ph: 'paint', tag: 'PAINT', t: 'Flags', d: ['Capture-point rings and flags, painted straight onto the ground layer.'] }),
  q: s => { const [t, d] = qName(s.o.k); return { ph: s.o.post ? 'fx' : 'paint', tag: 'PAINT', t: t + (s.count > 1 ? ` ×${s.count}` : ''), dg: 'queue', dec: s.o.k === 'soldier' || s.o.k === 'vehicle',
    d: [d, s.o.post ? 'This one is <b>after the light</b>: things that glow or float above everything (fire, flashes, sparks) would look wrong darkened by shade, so they wait until the lighting is on.' :
      'The <b>draw queue</b>: everything that stands up is painted lowest first, by its height. A crate is 10 px, a soldier about 20, sandbags 18, roofs 40, trees 56. Painting low to high means taller things cover shorter ones, as if you were looking straight down. Only <b>colour</b> is painted here: the art has no light or shadow baked in. Light comes later, on top.'],
    why: `Height in the queue: ${Math.round(s.o.z * 10) / 10} px.` }; },
  'gpu-mask': s => ({ ph: 'gpu', tag: 'GPU', t: 'Sight mask', dg: 'mask', aux: 'Sight mask (light buffer, half resolution)', lg: [['#ffffff', 'in sight'], ['#f0a040', 'roof (always known)'], ['#000', 'out of sight']], d: [
    'Lighting runs on the <b>graphics chip</b>, at half resolution, in its own hidden canvas. Nothing here appears on screen until the blend steps.',
    'First it paints the sight polygons from step 2 into a <b>mask</b>. Every later lighting step checks this mask for each pixel and picks between two sets of rules: <b>in sight</b> (everything lights and casts) or <b>memory</b> (only remembered things, no flashes).'] }),
  'cpu-heights': s => ({ ph: 'gpu', tag: 'CPU', t: 'List every solid thing', dg: 'lists', dec: true, d: [
    'Light needs to know <b>how tall</b> everything is. The processor lists every solid thing in view (plus a margin toward the sun, so shadows from just off-screen still fall in) as a shape with a height, sorted into four lists:',
    `<ul><li><b>a</b>: remembered small things (hay, fences, sandbags, wrecks): <b>${s.o.n.a}</b></li><li><b>u</b>: things the memory doesn’t keep (soldiers, vehicles, crates, items, flags, grenades): <b>${s.o.n.u}</b></li><li><b>w</b>: buildings: <b>${s.o.n.w}</b></li><li><b>t</b>: trees and roofs: <b>${s.o.n.t}</b></li></ul>`,
    'Units use the same test as painting: only if they or their shadow reach your sight.'] }),
  'gpu-h': s => ({ ph: 'gpu', tag: 'GPU', dg: 'heights', aux: 'Height map, everything (HT)', lg: HLEG, t: { a: 'Heights: remembered small things', u: 'Heights: units & loose objects', w: 'Heights: buildings', t: 'Heights: trees & roofs' }[s.o.l], d: [
    { a: 'Each pixel of the <b>height map</b> stores how tall the thing standing there is: brighter means taller. Hay, fences and sandbags go in first.',
      u: 'Soldiers, vehicles, crates go in. Sprites carry a painted height for every pixel (a jeep’s bonnet is lower than its roll bar). A part that sticks out in the air (a gun barrel past the hull) is marked as <b>floating</b>, with its own top and bottom, so its shadow starts away from the ground. Overlaps keep the highest top.',
      w: 'Buildings are written over whatever was there (a wall is solid), 40 px tall.',
      t: 'Tree canopies (domes, up to 56 px) and roof slabs. A roof is marked as a slab hanging at 36–42 px: it casts a shadow, but isn’t the surface you see.' }[s.o.l],
    'Colours: warm = standing on the ground, cyan = floating, violet tint = a roof over it.'] }),
  'gpu-hs': s => ({ ph: 'gpu', tag: 'GPU', t: 'Heights: remembered things only', dg: 'heights', aux: 'Height map, remembered only (HTS)', lg: HLEG, d: [
    'A <b>second height map</b> with only what the memory keeps: no soldiers, vehicles, crates or items.',
    'Out of sight, lighting uses this one. So the greyed memory still gets wall and tree shadows, but never a hidden soldier’s shadow or shape.'] }),
  'gpu-mat': s => ({ ph: 'gpu', tag: 'GPU', t: 'Materials', aux: 'Materials (MT)', lg: [['#3c78ff', 'shiny (reflects sky)'], ['#ffd040', 'glowing'], ['#30e0e0', 'water']], d: [
    'Per pixel: how <b>shiny</b> it is (paint, metal, ice), whether it <b>glows</b> (fire, lamps) and whether it’s <b>water</b>. These are used later for reflections, sparkle and bloom.'] }),
  'gpu-sweep': s => ({ ph: 'gpu', tag: 'GPU', dg: 'sweep', aux: (s.o.st ? 'Sweep, remembered only' : 'Sweep') + ` · pass reach ${s.o.n ? s.o.n * 2 : 1} px`, lg: [['#000', 'nothing blocks the sun'], ['linear-gradient(90deg,#3a2a6a,#e8d070)', 'height of what blocks it (low → high)']],
    t: (s.o.st ? 'Sun shadows (remembered only), pass ' : 'Sun shadows, pass ') + (s.pass + 1), d: [
    s.pass === 0 ? 'Sun shadows by <b>sweeping</b>. Each pixel asks: <i>what’s the tallest thing between me and the sun?</i> Pass 1 just looks 1 pixel toward the sun.' :
      `Pass ${s.pass + 1}: each pixel asks the pixel <b>${s.o.n} px</b> toward the sun what <i>it</i> already knows, and keeps the higher answer. Every pass doubles the reach (1, 2, 4, 8…), so a 64-px-long shadow needs only about 7 passes, however busy the scene.`,
    'A blocker further away counts as <b>lower</b> (distance × the sun’s slope): its shadow sinks toward the ground as it travels. The picture shows the height of whatever blocks the sun at each pixel. Where that height is above the ground here, the pixel is in shadow.',
    s.o.st ? 'This is the same sweep run on the <b>remembered-only</b> heights, used for pixels out of sight.' : ''] }),
  'gpu-light-sh': s => ({ ph: 'gpu', tag: 'GPU', t: 'Light pass: sun shadow', dg: 'sun', aux: 'Light pass · shadow channel', lg: [['#fff', 'lit'], ['#222', 'in shadow']], d: [
    'One small program runs for every pixel. <b>Shadow</b>: it compares this pixel’s own height with the blocker height from the sweep. Below it means shadow, above it means sunlit, with a soft 1.5 px edge.',
    'In sight it uses the full height map and sweep; out of sight, the remembered-only ones.'] }),
  'gpu-light-sl': s => ({ ph: 'gpu', tag: 'GPU', t: 'Light pass: slope toward the sun', dg: 'slope', aux: 'Light pass · slope channel', lg: [['#fff', 'faces the sun'], ['#555', 'faces away']], d: [
    'From the height map each pixel gets a <b>tilt</b> (how the surface leans, worked out from its neighbours’ heights). Surfaces leaning toward the sun get brighter, those leaning away get darker. This makes a jeep, a tree or a soldier look round instead of flat.',
    'Out of sight the tilt comes from the remembered-only heights, so a hidden unit leaves no shape behind.'] }),
  'gpu-light-pl': s => ({ ph: 'gpu', tag: 'GPU', t: 'Light pass: point lights', dg: 'point', aux: 'Light pass · point lights channel', lg: [['#ffb050', 'flash light']], d: [
    `Point lights (muzzle flashes, fire, explosions; <b>${s.o.n}</b> this frame). For each light: brightness falls with distance; a short ray toward the light checks for blockers (so walls cast flash shadows); and surfaces facing the light get more.`,
    'The light is treated as coming from at least a little above, so a flash at hip height still lights the side of a jeep that faces it.',
    '<b>Out of sight: skipped entirely.</b> A flash behind a wall must not give a shot away.'] }),
  'gpu-map': s => ({ ph: 'gpu', tag: 'GPU', dg: 'blend', aux: ['Map 1 · shade', 'Map 2 · highlights', 'Map 3 · glow & reflections'][s.o.q], t: ['Map 1: shade', 'Map 2: highlights', 'Map 3: glow & reflections'][s.o.q], d: [
    ['The light pass’s results become three pictures, each blended onto the world its own way. <b>Shade</b> is one colour per pixel to <b>multiply</b> with: white leaves it alone, blue-grey is shadow, darker on faces turned away. Roofs are white: they show as painted.',
     '<b>Highlights</b>: extra brightness for sun-facing slopes, point-light sparkle and glowing materials. It is applied with <b>colour dodge</b>, which brightens the art’s own colours instead of washing them grey.',
     '<b>Glow & reflections</b>: the warm glow of flashes, the sky reflected in shiny paint and water, bloom around glowing things. Simply <b>added</b>: light on top.'][s.o.q],
    'Out of sight, maps 2 and 3 are black (nothing added); map 1 there is the memory’s shade.'] }),
  comp: s => ({ ph: 'gpu', tag: 'BLEND', dg: 'blend', t: { multiply: 'Blend: multiply the shade', 'color-dodge': 'Blend: dodge the highlights', lighter: 'Blend: add the glow' }[s.o.m], d: [
    { multiply: 'The shade map is stretched back to full size and <b>multiplied</b> onto the painted world: every colour × the shade. White changes nothing, grey darkens, and the blue-grey of shadow tints too. Shadows appear for the first time.',
      'color-dodge': 'The highlights map is <b>dodged</b> on: bright parts of the map push the art’s colours brighter, by how bright the art already is. Sunny sides pop.',
      lighter: 'The glow map is <b>added</b>: flash light and reflections brighten what’s under them.' }[s.o.m],
    'These blends cover the whole view, in sight or not. Whatever is out of sight gets covered by the memory at the end.'] }),
  lights2d: s => ({ ph: 'gpu', tag: 'PAINT', t: 'Simple lights (sunlight off)', d: ['With sunlight off in settings, flashes are drawn as soft glows instead.'] }),
  softfog: s => ({ ph: 'fx', tag: 'PAINT', t: 'Soft sight blockers', d: ['Smoke and windows <b>partly</b> block sight. Inside your sight, the memory shows through them a little, faded by how thick they are.', s.same ? 'No smoke or windows in view this frame, so nothing is drawn.' : ''] }),
  smokes: s => ({ ph: 'fx', tag: 'PAINT', t: 'Smoke clouds', d: ['Smoke grenades and burning wrecks’ smoke, painted over everything.', s.same ? 'No smoke this frame.' : ''] }),
  lasers: s => ({ ph: 'fx', tag: 'PAINT', t: 'Laser sights', d: ['Laser-sight lines.', s.same ? 'None this frame.' : ''] }),
  'ov-copy': s => ({ ph: 'los', tag: 'OFF-SCREEN', t: 'Overlay 1: the remembered world', dg: 'overlay', aux: 'Overlay being built (off-screen)', d: [
    'Now the <b>line-of-sight overlay</b> is built off-screen. Step 1: start from the memory picture from step 2 (greyed, no people or vehicles).'] }),
  'ov-shade': s => ({ ph: 'los', tag: 'OFF-SCREEN', t: 'Overlay 2: shade it', dg: 'overlay', aux: 'Overlay being built (off-screen)', d: [
    'Step 2: <b>multiply</b> the shade map (map 1) onto it. Out of sight, that map was made from the remembered-only heights with no flashes. So the memory gets wall and tree shadows, but no hidden soldier’s shadow and no flash.'] }),
  'ov-hole': s => ({ ph: 'los', tag: 'OFF-SCREEN', t: 'Overlay 3: cut the hole', dg: 'overlay', aux: 'Overlay being built (off-screen)', d: [
    'Step 3: <b>erase</b> where you can see (the sight polygons, plus the roofs, which are always known). One plain fill, with no clipping masks.'] }),
  'ov-draw': s => ({ ph: 'los', tag: 'PAINT', t: 'Overlay 4: lay it on top', dg: 'overlay', dec: true, d: [
    'Step 4: the overlay goes over the frame. Everything under it was drawn whole; the overlay simply covers what you can’t see.',

  flow: s => { const order = ['prep', 'paint', 'gpu', 'fx', 'los', 'top']; return svg(70, order.map((p, i) => `<rect x="${4 + i * 52.5}" y="18" width="48" height="34" rx="5" fill="${p === s.m.ph ? PH[p][1] : '#1e261e'}" stroke="${PH[p][1]}"/><text x="${28 + i * 52.5}" y="39" text-anchor="middle" style="font-size:9px;fill:${p === s.m.ph ? '#111' : '#cfd3c6'}">${PH[p][0].split(' ')[0]}</text>`).join('')); },
  sight: () => svg(170, `${arrow}<rect x="150" y="50" width="60" height="50" fill="#5a5a52"/><text x="180" y="79" text-anchor="middle">wall</text>
    <polygon points="60,85 150,50 150,10 316,10 316,20 210,50 210,100 316,160 316,166 4,166 4,10 150,10 150,50 150,100" fill="rgba(111,195,216,.15)" stroke="none"/>
    <path d="M60 85 L150 50 L316 -10 M60 85 L150 100 L316 156" stroke="#6fc3d8" stroke-dasharray="3 3" fill="none"/>
    <polygon points="150,50 316,-10 316,156 150,100 210,100 210,50" fill="rgba(0,0,0,.55)"/><text x="262" y="80" text-anchor="middle" class="sm">hidden: covered</text><text x="262" y="92" text-anchor="middle" class="sm">by the memory</text>
    <circle cx="60" cy="85" r="6" fill="#6fc3d8"/><text x="60" y="108" text-anchor="middle">eye</text><text x="70" y="30" class="sm">visible area = the sight polygon</text><text x="70" y="42" class="sm">rays to every wall corner build it</text>`),
  mask: () => svg(120, `<rect x="10" y="10" width="300" height="100" fill="#000"/><polygon points="10,10 200,10 140,110 10,110" fill="#fff"/><rect x="220" y="25" width="70" height="40" fill="#f0a040"/><text x="70" y="64" style="fill:#111">in sight</text><text x="255" y="49" text-anchor="middle" style="fill:#111">roof</text><text x="245" y="95" text-anchor="middle">out of sight → memory rules</text>`),
  queue: s => {
    const qs = steps.filter(t => t.k === 'q' && !t.o.post);
    const rows = qs.slice(0, 14), h = 18 + rows.length * 15;
    return svg(h, rows.map((t, i) => `<rect x="110" y="${8 + i * 15}" width="${Math.max(2, t.o.z / 60 * 190)}" height="11" rx="2" fill="${t === s ? '#e8c45a' : '#3c4a3a'}"/><text x="104" y="${17 + i * 15}" text-anchor="end" style="${t === s ? 'fill:#e8c45a;font-weight:600' : ''}">${qName(t.o.k)[0]}${t.count > 1 ? ' ×' + t.count : ''}</text><text x="${114 + Math.max(2, t.o.z / 60 * 190)}" y="${17 + i * 15}" class="sm">${Math.round(t.o.z)} px</text>`).join('') +
      `<text x="110" y="${h - 2}" class="sm">painted top to bottom: lowest first</text>`);
  },
  lists: () => svg(150, [['a', 'remembered small', 'hay · fences · sandbags · wrecks', 1, 1], ['u', 'not remembered', 'soldiers · vehicles · crates · items', 1, 0], ['w', 'buildings', 'walls, 40 px', 1, 1], ['t', 'trees & roofs', 'canopies · roof slabs', 1, 1]].map(([l, n, e, A, B], i) =>
    `<text x="8" y="${30 + i * 30}" style="font-weight:700;fill:#e8c45a">${l}</text><text x="24" y="${26 + i * 30}">${n}</text><text x="24" y="${38 + i * 30}" class="sm">${e}</text><rect x="214" y="${18 + i * 30}" width="44" height="16" rx="3" fill="${A ? '#6a4a1a' : '#222'}"/><rect x="266" y="${18 + i * 30}" width="44" height="16" rx="3" fill="${B ? '#2a4a5a' : '#222'}"/><text x="236" y="${30 + i * 30}" text-anchor="middle" class="sm">${A ? '✓' : ''}</text><text x="288" y="${30 + i * 30}" text-anchor="middle" class="sm">${B ? '✓' : '—'}</text>`).join('') +
    `<text x="236" y="12" text-anchor="middle" class="sm">in sight</text><text x="288" y="12" text-anchor="middle" class="sm">memory</text>`),
  heights: () => svg(150, `<line x1="6" y1="130" x2="314" y2="130" stroke="#6c7668"/><text x="8" y="144" class="sm">ground</text>
    <rect x="30" y="50" width="40" height="80" fill="#a0702a"/><text x="50" y="44" text-anchor="middle">wall</text><text x="50" y="94" text-anchor="middle" class="sm">0 → 40</text>
    <rect x="120" y="104" width="80" height="26" fill="#a0702a"/><rect x="140" y="92" width="22" height="12" fill="#c08a3a"/><text x="160" y="124" text-anchor="middle" class="sm">hull 0 → 13</text>
    <rect x="200" y="96" width="44" height="6" fill="#40b0d0"/><text x="226" y="90" text-anchor="middle" class="sm">gun 14 → 17, floating</text>
    <path d="M200 102 L244 102" stroke="none"/><line x1="222" y1="104" x2="222" y2="128" stroke="#40b0d0" stroke-dasharray="2 3"/><text x="250" y="114" class="sm">gap under it:</text><text x="250" y="125" class="sm">shadow lifts off</text>
    <text x="8" y="14" class="sm">each pixel stores: grounded top · floating top & bottom · roof flag</text>`),
  sweep: s => {
    const n = s.o.n || 0, reach = n === 0 ? 1 : n, cells = Math.max(16, reach + 4), cw = 300 / cells, x0 = 10, y = 80;
    let b = `${arrow}<text x="300" y="30" text-anchor="end">☀ sun this way →</text>`;
    for (let i = 0; i < cells; i++) b += `<rect x="${x0 + i * cw}" y="${y}" width="${Math.max(1, cw - (cw > 6 ? 2 : 0.5))}" height="16" rx="2" fill="${i === 2 ? '#e8c45a' : '#2c372c'}"/>`;
    b += `<path d="M${x0 + 2.5 * cw} ${y} Q ${x0 + (2.5 + reach / 2) * cw} ${y - 30 - Math.min(30, reach)} ${x0 + (2.5 + reach) * cw} ${y}" stroke="#e8c45a" fill="none" marker-end="url(#ah)"/>`;
    b += `<text x="${x0 + 2.5 * cw}" y="${y + 32}" text-anchor="middle" class="sm">this pixel</text><text x="160" y="${y + 52}" text-anchor="middle">pass ${s.pass + 1}: asks the pixel ${reach} px toward the sun</text>`;
    b += `<text x="160" y="${y + 66}" text-anchor="middle" class="sm">reach after this pass: ${n === 0 ? 1 : n * 2} px · it doubles every pass</text>`;
    return svg(150, b);
  },
  sun: () => { const el = scene ? scene.sun[1] : 0.7, h = 60, L = h / Math.tan(el); return svg(150, `${arrow}<line x1="6" y1="130" x2="314" y2="130" stroke="#6c7668"/>
    <rect x="70" y="${130 - h}" width="14" height="${h}" fill="#a0702a"/><rect x="84" y="128" width="${L}" height="4" fill="#223"/>
    <line x1="${84 - 90}" y1="${130 - h - 90 * Math.tan(el)}" x2="${84 + L}" y2="130" stroke="#e8c45a" stroke-dasharray="4 3"/>
    <text x="10" y="20">☀</text><text x="${84 + L / 2}" y="146" text-anchor="middle" class="sm">shadow = height ÷ tan(sun height)</text>
    <text x="200" y="60" class="sm">a pixel is in shadow when</text><text x="200" y="72" class="sm">the blocker height (from the</text><text x="200" y="84" class="sm">sweep) is above its own</text>`); },
  slope: () => svg(140, `${arrow}<path d="M10 120 Q 160 20 310 120" fill="#3c4a3a"/><path d="M10 120 Q 85 58 160 45" stroke="#f0e0a0" stroke-width="5" fill="none"/><path d="M160 45 Q 235 58 310 120" stroke="#555" stroke-width="5" fill="none"/>
    <line x1="90" y1="70" x2="70" y2="40" stroke="#6fc3d8" marker-end="url(#ab)"/><line x1="230" y1="70" x2="250" y2="40" stroke="#6fc3d8" marker-end="url(#ab)"/><text x="12" y="18">☀ ←</text>
    <text x="60" y="100" class="sm">faces the sun: brighter</text><text x="200" y="100" class="sm">faces away: darker</text><text x="170" y="20" class="sm">blue arrows: the surface’s tilt</text>`),
  point: () => svg(140, `${arrow}<line x1="6" y1="120" x2="314" y2="120" stroke="#6c7668"/><rect x="180" y="80" width="90" height="40" fill="#5a6a3a"/><text x="225" y="104" text-anchor="middle" class="sm">jeep, 13 px</text>
    <circle cx="80" cy="110" r="7" fill="#ffb050"/><text x="80" y="136" text-anchor="middle" class="sm">flash at 12 px</text>
    <line x1="88" y1="108" x2="178" y2="96" stroke="#ffb050" marker-end="url(#ah)" stroke-dasharray="4 3"/><line x1="88" y1="104" x2="178" y2="60" stroke="#e8c45a" marker-end="url(#ah)"/>
    <text x="110" y="40" class="sm">used for shading: from at least a little above</text><text x="110" y="52" class="sm">(dashed: the true direction, from below)</text>`),
  blend: () => { const sw = (x, y, c) => `<rect x="${x}" y="${y}" width="34" height="22" rx="3" fill="${c}"/>`; return svg(130, `<text x="8" y="16" class="sm">art</text><text x="104" y="16" class="sm">map</text><text x="200" y="16" class="sm">result</text>
    ${sw(8, 22, '#6a8a3a')}<text x="56" y="38">×</text>${sw(104, 22, '#7a86a0')}<text x="152" y="38">=</text>${sw(200, 22, '#33402a')}<text x="244" y="38" class="sm">multiply: shade</text>
    ${sw(8, 56, '#6a8a3a')}<text x="52" y="72">dodge</text>${sw(104, 56, '#605030')}<text x="152" y="72">=</text>${sw(200, 56, '#9cc858')}<text x="244" y="72" class="sm">highlight</text>
    ${sw(8, 90, '#6a8a3a')}<text x="56" y="106">+</text>${sw(104, 90, '#503010')}<text x="152" y="106">=</text>${sw(200, 90, '#baba4a')}<text x="244" y="106" class="sm">add: glow</text>`); },
  overlay: s => { const st = { 'ov-copy': 0, 'ov-shade': 1, 'ov-hole': 2, 'ov-draw': 3 }[s.k];
    const L = (y, f, t, on) => `<g opacity="${on ? 1 : 0.35}"><polygon points="10,${y} 190,${y} 226,${y + 26} 46,${y + 26}" fill="${f}" stroke="#6c7668"/><text x="232" y="${y + 17}" class="sm">${t}</text></g>`;
    return svg(170, `${L(120, '#5a7a3a', 'world, drawn whole', st === 3)}${L(84, '#6a6a66', 'memory (grey)', st >= 0)}${st >= 1 ? '<polygon points="10,84 190,84 226,110 46,110" fill="rgba(60,70,110,.35)"/>' : ''}${st >= 2 ? '<ellipse cx="118" cy="97" rx="46" ry="9" fill="#101410" stroke="#7fd16b"/><text x="118" y="100" text-anchor="middle" class="sm" style="fill:#7fd16b">hole = sight</text>' : ''}
      <text x="8" y="18">${['1. copy the memory', '2. multiply the shade', '3. cut the sight hole', '4. lay it on the world'][st]}</text>${st === 3 ? '<line x1="118" y1="107" x2="118" y2="128" stroke="#7fd16b" stroke-dasharray="3 3"/><text x="118" y="160" text-anchor="middle" class="sm">you see the world through the hole</text>' : ''}`); },
};

/* ================= controls ================= */
$('next').onclick = () => show(cur + 1); $('prev').onclick = () => show(cur - 1); $('first').onclick = () => show(0);
$('slider').oninput = e => show(+e.target.value);
$('tChange').onchange = () => show(cur); $('tSight').onchange = () => drawOver();
let playT = null;
$('play').onclick = () => { if (playT) { clearInterval(playT); playT = null; $('play').textContent = '▶ Play'; return; } $('play').textContent = '❚❚ Pause'; playT = setInterval(() => { if (cur >= steps.length - 1) { $('play').click(); return; } show(cur + 1); }, 1100); };
$('recap').onclick = () => capture();
addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return; if (e.key === 'ArrowRight') { show(cur + 1); e.preventDefault(); } if (e.key === 'ArrowLeft') { show(cur - 1); e.preventDefault(); } });
boot().catch(e => { lmsg('Couldn’t start: ' + e.message); console.error(e); });
</script>
</body>
</html>
