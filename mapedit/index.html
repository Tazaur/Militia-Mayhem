<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Militia Mayhem · Map Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* the map editor: a map's ground as a base texture and polygons stamped over it (../src/2b_ground.js bakes it, here and in the game) */
:root{
  --bg:#0d120b;--panel:#1a2316;--panel2:#212c1c;--line:#2f3c28;--line2:#3d4d34;
  --ink:#ece4c8;--dim:#a49f86;--faint:#6f725f;--acc:#e0b72c;--acc2:#f5d670;--red:#ef5a44;--green:#7ddc6a;--cyan:#5fd3d0;
  --fd:'Black Ops One',system-ui;--fb:'Chakra Petch',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace;color-scheme:dark
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column;position:fixed;inset:0}
button,select,input{font:inherit;color:inherit}
.bar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:48px}
#top{padding-top:calc(6px + env(safe-area-inset-top))}
.tabs{flex:none;display:flex;gap:4px;padding:5px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs button{flex:1;height:36px;border:1px solid var(--line2);border-radius:9px;background:var(--panel2);font-weight:700;font-size:13px;letter-spacing:.3px;cursor:pointer;color:var(--dim)}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#1a1405}
.scr .btn{flex:none}
.scr{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
.sel{height:38px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);padding:0 6px;min-width:0;font-weight:600}
#name{flex:1;min-width:0;font-family:var(--fd);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.4px}
#wrap{flex:1;position:relative;min-height:0;background:#070a06}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:10px;top:8px;right:10px;font-size:12px;color:var(--dim);pointer-events:none;text-shadow:0 1px 2px #000}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.btm{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
.btm .r{display:flex;align-items:center;gap:6px;min-height:42px}
.btm .r+.r{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.btm .r.pad+.r.pad,.btm .r+.r.pad{border-top-color:transparent}
#ctx{position:absolute;left:50%;top:30px;transform:translateX(-50%);display:none;align-items:center;gap:6px;padding:5px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
#ctx.on{display:flex}#ctx::-webkit-scrollbar{display:none}#ctx .btn{flex:none}#ctx b{font-size:13px;flex:none;padding:0 6px;white-space:nowrap}
.lay .lk{flex:none;width:38px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line2);font-size:15px}
.lay .lk.on{background:var(--acc);border-color:var(--acc)}.lay .lk:not(.on){opacity:.4}
.lay.lkd .n{color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:38px;min-width:38px;padding:0 10px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:disabled{opacity:.35}
.btn.on{background:var(--acc);color:#1a1405;border-color:var(--acc)}
.btn.red{color:var(--red)}
.btn.ic{padding:0;width:38px;font-size:16px}
.sp{flex:1}
.sw{width:22px;height:22px;border-radius:5px;border:1px solid var(--line2);image-rendering:pixelated;flex:none;background-size:44px 44px}
.sl{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.sl span{font-size:12px;color:var(--dim)}
.sl b{font-family:var(--fm);font-size:12px;min-width:34px;text-align:right;font-weight:400}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:60px;height:34px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--acc);margin-top:-9px;border:2px solid var(--bg)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
.muted{color:var(--dim);font-size:12px}
/* menus and sheets: over everything, a backdrop to tap away */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
#veil.on{display:block}
.menu{position:fixed;z-index:21;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px;min-width:200px;max-width:calc(100vw - 20px);max-height:70vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
.menu.on{display:block}
.menu button.it{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;font-size:14px}
.menu button.it:active,.menu button.it.on{background:var(--panel2)}
.menu button.it .k{margin-left:auto;color:var(--faint);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.menu h3{font-family:var(--fd);font-weight:400;font-size:13px;color:var(--acc2);margin:4px 8px 6px;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;padding:2px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);cursor:pointer;font-size:11px}
.grid button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.grid .sw{width:48px;height:48px;background-size:96px 96px}
.form{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;padding:4px 8px 8px}
.form input,.form select{height:38px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);padding:0 8px;min-width:0}
.form .full{grid-column:1/3;display:flex;gap:6px;justify-content:flex-end}
.lay{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 8px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left}
.lay.on{background:var(--panel2);box-shadow:0 0 0 1px var(--acc) inset}
.lay .n{flex:1;font-size:13px}
.lay .m{font-family:var(--fm);font-size:11px;color:var(--faint)}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--acc);color:#1a1405;font-weight:700;padding:8px 14px;border-radius:10px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;font-size:13px;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="bar" id="top">
  <button class="btn" id="bMap" aria-label="Map menu">☰ Map</button>
  <div id="name">…</div>
  <button class="btn ic" id="bUndo" aria-label="Undo">↶</button>
  <button class="btn ic" id="bRedo" aria-label="Redo">↷</button>
  <button class="btn" id="bView" aria-label="View menu">View ▾</button>
</div>
<div class="tabs" id="tabs"><button data-tab="ter">Terrain</button><button data-tab="det">Details</button><button data-tab="play">Gameplay</button></div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hint"></div>
  <div id="ctx"></div>
  <div id="zoom"><button class="btn ic" id="bZin" aria-label="Zoom in">＋</button><button class="btn ic" id="bZout" aria-label="Zoom out">－</button><button class="btn ic" id="bFit" aria-label="Fit map" style="font-size:13px">⤢</button></div>
</div>
<div class="btm" id="btm"></div>
<div id="veil"></div>
<div class="menu" id="menu"></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
/* the game's atlas: textures are its tex_<name> sprites (colour + the material atlas's heights), read by 2b_ground.js */
let ATLAS = {};
const IMG = new Image(), MIMG = new Image();
</script>
<script src="../src/2b_ground.js"></script>
<script src="../src/2c_props.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s), cv = $('#cv'), cx = cv.getContext('2d');
const SKEY = 'mmgl.mapedit', LKEY = 'mmgl.maplab';
const SIZES = [[3000, 2000], [2000, 1400], [4000, 2600], [1600, 1600]];
/* ---------- state: every map (by id), the open one, the view, the selection, the tool ---------- */
const S = (() => { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } })();
S.maps = S.maps || {}; S.view = S.view || 'col';
const save = () => { try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) { toast('Storage full: export your maps'); } };
let G = null;                                   // the open map
const V = { x: 0, y: 0, z: 0.3 };               // view: screen = (world - x, y) * z (CSS px)
let tab = S.tab || 'ter', osel = -1, place = null;     // the tab; the selected object (G.objs); the kind being placed
let sel = -1, selV = null, tool = 'select', draft = null;     // selected stamp, its selected point [line, index]; draft: the shape / road being drawn
const UNDO = [], REDO = [];
/* the selection: a stamp (sel >= 0) or the battlefield edge (sel -2: G.bounds {p, r}, edited as a shape is) */
const EDGE = -2, cur = () => sel === EDGE ? G.bounds : G.stamps[sel];
const slug = n => (n || 'map').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'map';
function newMap(name, w, h, base) {
  let id = slug(name), k = 2; while (S.maps[id]) id = slug(name) + '_' + k++;
  const m = Math.round(Math.min(w, h) * 0.12);     // the battlefield edge, set in: the ring outside it is out-of-bounds ground you can paint (the game shows nothing past the map)
  return { v: 1, id, name, w, h, base, stamps: [], bounds: { p: [m, m, w - m, m, w - m, h - m, m, h - m], r: 0 } };
}
function open(id) {
  G = S.maps[id]; S.cur = id; sel = -1; selV = null; osel = -1; place = null; draft = null; UNDO.length = REDO.length = 0;
  bakeAll(); fit(); ui(); save();
}
/* a change: undo keeps the map before it */
function snap() { UNDO.push(JSON.stringify({ base: G.base, stamps: G.stamps, bounds: G.bounds, objs: G.objs })); if (UNDO.length > 100) UNDO.shift(); REDO.length = 0; }
function restore(from, to) {
  if (!from.length) return; to.push(JSON.stringify({ base: G.base, stamps: G.stamps, bounds: G.bounds, objs: G.objs }));
  const o = JSON.parse(from.pop()); G.base = o.base; G.stamps = o.stamps; G.bounds = o.bounds; if (!G.bounds) delete G.bounds; G.objs = o.objs || []; osel = Math.min(osel, G.objs.length - 1); sel = sel === EDGE && !G.bounds ? -1 : Math.min(sel, G.stamps.length - 1); selV = null; bakeAll(); save(); ui();
}

/* ---------- the bake: the map at full size (colour, and the material map when it's shown), only what changed ---------- */
const BK = { c: null, m: null, dirty: null, t: 0 };
function bakeAll() {

  if (BK.c.width !== G.w || BK.c.height !== G.h) { BK.c.width = G.w; BK.c.height = G.h; }
  if (S.view === 'mat') { if (!BK.m) BK.m = document.createElement('canvas'); BK.m.width = G.w; BK.m.height = G.h; } else BK.m = null;
  BK.dirty = null; BK.h = gBake(G, BK.c.getContext('2d'), BK.m && BK.m.getContext('2d'), null); draw();
}
const boxU = (a, b) => !a ? b : !b ? a : { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.max(a.x + a.w, b.x + b.w) - Math.min(a.x, b.x), h: Math.max(a.y + a.h, b.y + b.h) - Math.min(a.y, b.y) };
function dirty(b) { BK.dirty = boxU(BK.dirty, b); }
function bakeDirty() {
  const b = BK.dirty; if (!b) return; BK.dirty = null;
  const x = Math.max(0, b.x), y = Math.max(0, b.y), r = { x, y, w: Math.min(G.w, b.x + b.w) - x, h: Math.min(G.h, b.y + b.h) - y }; if (r.w <= 0 || r.h <= 0) return;
  gBake(G, BK.c.getContext('2d'), BK.m && BK.m.getContext('2d'), r); BK.t = performance.now();
}

/* ---------- drawing the view ---------- */
let W = 0, H = 0, DPR = 1, raf = 0;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); const r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); draw(); }
function draw() { if (!raf) raf = requestAnimationFrame(frame); }
const PAT = {}; const pat = n => { const k = n + (gReady(IMG) ? 1 : 0); return PAT[k] || (PAT[k] = cx.createPattern(gTex(n).c, 'repeat')); };
function frame() {
  raf = 0; if (!G) return;
  if (BK.dirty && (!drag || performance.now() - BK.t > 70)) bakeDirty();

  cx.setTransform(DPR, 0, 0, DPR, 0, 0); cx.fillStyle = '#070a06'; cx.fillRect(0, 0, W, H);
  cx.setTransform(DPR * V.z, 0, 0, DPR * V.z, -V.x * V.z * DPR, -V.y * V.z * DPR); cx.imageSmoothingEnabled = V.z < 1;

  cx.drawImage(mat ? BK.m : BK.c, 0, 0);
  const k = 1 / V.z;
  cx.lineWidth = 2 * k; cx.strokeStyle = 'rgba(255,90,60,.6)'; cx.setLineDash([10 * k, 8 * k]); cx.strokeRect(0, 0, G.w, G.h); cx.setLineDash([]);
  if (sel !== -1) {
    const s = cur();
    if (s.r > 0) { gPath(cx, { p: s.p, l: s.l }); cx.lineWidth = 1 * k; cx.strokeStyle = 'rgba(245,214,112,.35)'; cx.setLineDash([4 * k, 5 * k]); cx.stroke(); cx.setLineDash([]); }     // the points' cage
    if (s.l) { gPath(cx, s); cx.lineWidth = s.wd; cx.lineCap = cx.lineJoin = 'round'; cx.strokeStyle = 'rgba(245,214,112,.16)'; cx.stroke(); cx.lineCap = cx.lineJoin = 'miter'; }     // the road's width
    gPath(cx, s); cx.lineWidth = 2.5 * k; cx.strokeStyle = '#000'; cx.stroke(); cx.lineWidth = 1.5 * k; cx.strokeStyle = '#f5d670'; cx.stroke();
    if (s.soft > 0 && !s.l) { gPath(cx, s); cx.lineWidth = s.soft; cx.strokeStyle = 'rgba(245,214,112,.12)'; cx.stroke(); }     // the blend zone
    if (tool === 'select') { for (const [li, i, x, y] of mids(s)) dot(x, y, 5 * k, 'rgba(95,211,208,.85)'); for (const [li, i, x, y] of verts(s)) dot(x, y, 8 * k, selV && selV[0] === li && selV[1] === i ? '#ef5a44' : '#f5d670', 2 * k); }
  }
  drawObjs();

    const p = draft.p, road = draft.k !== 'shape';
    if (p.length >= (road ? 4 : 6)) {
      gPath(cx, road ? { l: [p], r: draft.r } : { p, r: draft.r }); cx.globalAlpha = 0.7;
      if (road) { cx.strokeStyle = pat(draft.t); cx.lineWidth = draft.wd; cx.lineCap = cx.lineJoin = 'round'; cx.stroke(); cx.lineCap = cx.lineJoin = 'miter'; } else { cx.fillStyle = pat(draft.t); cx.fill(); }
      cx.globalAlpha = 1;
    }
    cx.beginPath(); for (let i = 0; i < p.length; i += 2) cx.lineTo(p[i], p[i + 1]); if (!road && p.length >= 6) cx.closePath();

}
function dot(x, y, r, c, lw) { cx.fillStyle = c; cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill(); if (lw) { cx.strokeStyle = '#000'; cx.lineWidth = lw; cx.stroke(); } }
/* the scale guide (bottom left, true size at this zoom): a tank, a jeep, a soldier and a ruler */
function guide() {
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const z = V.z, ns = [['hull0', 'tank'], ['jeep0', 'jeep'], ['sol_stand', 'soldier']].filter(([n]) => ATLAS[n] && gReady(IMG));
  const nice = [25, 50, 100, 200, 250, 500, 1000, 2000].find(v => v * z >= 50) || 2000, rl = nice * z;
  const slot = n => Math.max(ATLAS[n][2] * z, 40) + 8; let w = 16 + rl, x = 10; for (const [n] of ns) w += slot(n);
  const y0 = H - 10, hh = Math.max(40, ...ns.map(([n]) => ATLAS[n][3] * z + 22));
  cx.fillStyle = 'rgba(13,18,11,.72)'; cx.beginPath(); cx.roundRect ? cx.roundRect(x, y0 - hh, w, hh, 8) : cx.rect(x, y0 - hh, w, hh); cx.fill();
  cx.font = '600 10px Chakra Petch, system-ui'; cx.textAlign = 'center'; cx.fillStyle = '#ece4c8'; cx.imageSmoothingEnabled = true;

}
const toWorld = (sx, sy) => [sx / V.z + V.x, sy / V.z + V.y];
function fit() { const z = Math.min(W / G.w, H / G.h) * 0.94; V.z = z; V.x = G.w / 2 - W / 2 / z; V.y = G.h / 2 - H / 2 / z; draw(); }
function zoomAt(f, sx, sy) { const [wx, wy] = toWorld(sx, sy); V.z = Math.max(0.05, Math.min(8, V.z * f)); V.x = wx - sx / V.z; V.y = wy - sy / V.z; draw(); }

/* ---------- a stamp's handles: its points [line, index, x, y], and the midpoints between them (a shape's wrap round) ---------- */
function verts(s) { const o = []; gLines(s).forEach((p, li) => { for (let i = 0; i < p.length; i += 2) o.push([li, i, p[i], p[i + 1]]); }); return o; }

  const o = []; gLines(s).forEach((p, li) => { for (let i = 0; i < p.length; i += 2) { const j = i + 2 < p.length ? i + 2 : s.l ? -1 : 0; if (j >= 0) o.push([li, i, (p[i] + p[j]) / 2, (p[i + 1] + p[j + 1]) / 2]); } });
  return o;
}
/* the nearest point on a line to (x, y): [distance, x, y, segment start index] */
function near(p, x, y) {
  let best = [1e9, 0, 0, 0];
  for (let i = 0; i + 2 < p.length; i += 2) {
    const ax = p[i], ay = p[i + 1], dx = p[i + 2] - ax, dy = p[i + 3] - ay, l = dx * dx + dy * dy || 1, t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / l));
    const qx = ax + dx * t, qy = ay + dy * t, d = Math.hypot(x - qx, y - qy); if (d < best[0]) best = [d, qx, qy, i];
  }
  return best;
}
const inPoly = (x, y, p) => { let c = false; for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) { const xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
const hits = (s, x, y) => s.l ? s.l.some(p => near(p, x, y)[0] < s.wd / 2 + 10 / V.z) : inPoly(x, y, s.p);
const copyL = s => gLines(s).map(p => p.slice());

/* ---------- touch: one finger by tool (select: a handle, a stamp, or pan; drawing: tap a point, drag pans), two pinch ---------- */
const PT = new Map(); let drag = null, pinch = null;
const ox = e => e.clientX - cv.getBoundingClientRect().left, oy = e => e.clientY - cv.getBoundingClientRect().top;     // CSS px in the canvas

/* ---------- the bottom bar: tools, then what the selection / drawing / map can do ---------- */
/* the bars: the bottom one always three rows high; the selection's actions in the floating #ctx bar over the map */
function bars(h, ctx) { $('#btm').innerHTML = h + '<div class="r pad"></div>'.repeat(Math.max(0, 3 - (h.match(/<div class="r"/g) || []).length)); const c = $('#ctx'); c.innerHTML = ctx || ''; c.classList.toggle('on', !!ctx); }
/* a stamp's numbers: one slider, chips pick which */

    <div class="r"><label class="sl"><span>${P[0]}</span><input type="range" id="pv" min="${P[1]}" max="${P[2]}" step="1" value="${v}"><b id="pvV">${v}</b></label></div>`;
    ctx = `<button class="btn ic" data-a="up" title="Up">▲</button><button class="btn ic" data-a="down" title="Down">▼</button><button class="btn ic" data-a="eye" title="Hide">${s.off ? '◌' : '◉'}</button><button class="btn ic${s.lock ? ' on' : ''}" data-a="lock" title="Lock">${s.lock ? '🔒' : '🔓'}</button><button class="btn ic" data-a="dup" title="Duplicate">⧉</button>${s.l ? '<button class="btn" data-a="branch">⑂ Branch</button>' : ''}${canDelV(s) ? '<button class="btn" data-a="delv">− Point</button>' : ''}<button class="btn ic red" data-a="del" title="Delete">🗑</button>`;

  else if (s && !draft) { const b = gBox(s), e = Math.ceil((s.soft || 0) * 1.2) + 1; $('#hint').textContent = `${s.l ? 'Road' : 'Shape'} ${b.w - 2 * e} × ${b.h - 2 * e} px${s.l ? ' · ' + s.wd + ' wide' : ''} · drag it or its points · blue dots add points`; }

/* the Details / Gameplay bar: select, or a kind to place (tap the map to put one down); the selection's settings:
   choices as dropdowns, numbers and facing on one slider with chips to pick which, then duplicate / delete */
const OPROPS = o => OK[o.k].set.filter(q => q[2] !== 'pick');
function uiObj() {
  const os = objs(), mine = os.filter(o => OK[o.k] && OK[o.k].tab === tab).length, o = os[osel] && OK[os[osel].k].tab === tab ? os[osel] : null; if (!o) osel = -1;
  let ctx = '', h = `<div class="r"><button class="btn${!place ? ' on' : ''}" data-a="osel">✥</button><div class="scr">${kindsOf(tab).map(k => `<button class="btn${place === k ? ' on' : ''}" data-place="${k}">${OK[k].ic} ${OK[k].n}</button>`).join('')}</div><button class="btn" data-a="olist">☰ ${mine}</button></div>`;
  if (o) {

    h += `<div class="r"><div class="scr">${ps.length > 1 ? ps.map(q => `<button class="btn${q[0] === S.oprop ? ' on' : ''}" data-oprop="${q[0]}">${q[1]}</button>`).join('') : ''}<span class="sp"></span>${picks.map(([f, n, , opts]) => `<select class="sel" data-set="${f}" aria-label="${n}">${opts.map(([v, l]) => `<option value="${v}"${(o[f] ?? D.def[f]) == v ? ' selected' : ''}>${l}</option>`).join('')}</select>`).join('')}</div></div>`;
    if (ps.length) {

      h += `<div class="r"><label class="sl"><span>${P[1]}</span><input type="range" id="ov" min="${ang ? 0 : P[3]}" max="${ang ? 359 : P[4]}" step="${ang ? 5 : P[5]}" value="${v}"><b id="ovV">${v}${ang ? '°' : ''}</b></label></div>`;
    }
  } else h += `<div class="r"><span class="muted" style="flex:1">${place ? 'Tap the map to place a ' + OK[place].n.toLowerCase() + ' · ✥ when done' : 'Pick something above to place it, or tap one to edit it'}${tab === 'play' && !os.some(q => q.k === 'flag') ? ' · no objectives yet: the game places A, B, C' : ''}</span></div>`;

  const remember = () => { (S.last || (S.last = {}))[o.k] = Object.fromEntries(OK[o.k].set.map(q => [q[0], o[q[0]]])); save(); };     // new ones of this kind start the same
  for (const el of document.querySelectorAll('#btm [data-set]')) el.onchange = () => { snap(); const f = el.dataset.set, v = el.value; o[f] = isNaN(+v) ? v : +v; remember(); ui(); draw(); };

}
function objList(anchor) {
  const os = objs(), ids = os.map((o, i) => i).filter(i => OK[os[i].k] && OK[os[i].k].tab === tab).reverse();
  pop(`<h3>${tab === 'det' ? 'Details' : 'Gameplay'}</h3>${ids.length ? '' : '<p class="muted" style="margin:4px 8px">None placed yet.</p>'}${ids.map(i => { const o = os[i], D = OK[o.k]; return `<button class="lay${i === osel ? ' on' : ''}${o.lock ? ' lkd' : ''}" data-i="${i}"><span style="width:22px;text-align:center">${D.ic}</span><span class="n">${D.n}${o.k === 'flag' ? ' ' + flagName(o) : ''}${o.team !== undefined ? ' · ' + (o.team === -1 ? 'no team' : TEAMS[o.team ? 1 : 0][1]) : ''}${o.type ? ' · ' + o.type : ''}</span><span class="m">${o.x}, ${o.y}</span>${lockBtn(i, o)}</button>`; }).join('')}`, anchor,
    m => m.onclick = e => { if (lockTap(e, os, () => objList(anchor))) return; const b = e.target.closest('[data-i]'); if (!b) return; unpop(); osel = +b.dataset.i; place = null; const o = os[osel]; if (o.x < V.x || o.y < V.y || o.x > V.x + W / V.z || o.y > V.y + H / V.z) { V.x = o.x - W / 2 / V.z; V.y = o.y - H / 2 / V.z; } ui(); draw(); });

const onBar = e => {
  const ob = e.target.closest('button[data-place],button[data-oprop],button[data-a^="o"]');
  if (ob && tab !== 'ter') {
    const a = ob.dataset.a, o = objs()[osel];
    if (ob.dataset.place) { place = place === ob.dataset.place ? null : ob.dataset.place; osel = -1; }
    if (ob.dataset.oprop) S.oprop = ob.dataset.oprop;
    if (a === 'osel') place = null;
    if (a === 'olist') return objList(ob);
    if (a === 'odup' && o) { snap(); const c = JSON.parse(JSON.stringify(o)); c.x += 40; c.y += 40; objs().push(c); osel = objs().length - 1; save(); }
    if (a === 'odel' && o) { snap(); objs().splice(osel, 1); osel = -1; save(); }

  const b = e.target.closest('button[data-a],button[data-prop]'); if (!b) return; const a = b.dataset.a, s = sel !== -1 ? cur() : null;
  if (b.dataset.prop) { S.prop = b.dataset.prop; save(); }
  if (a === 'sel') { tool = 'select'; draft = null; }
  if (a === 'draw') startDraft('shape');
  if (a === 'road') startDraft('road');
  if (a === 'branch') startDraft('branch');
  if (a === 'shape') return shapeMenu(b);
  if (a === 'layers') return layersMenu(b);
  if (a === 'dtex') return texPicker(b, draft.t, t => { draft.t = t; if (draft.k === 'road') S.rtex = t; else S.tex = t; save(); ui(); draw(); });
  if (a === 'dback') draft.p.splice(-2);
  if (a === 'dx') { if (draft.k === 'branch') sel = draft.of; draft = null; tool = 'select'; }

  if (a === 'edgeoff') { snap(); delete G.bounds; sel = -1; selV = null; dirty({ x: 0, y: 0, w: G.w, h: G.h }); save(); }
  if (a === 'tex') return texPicker(b, s.t, t => { snap(); if (s.l) S.rtex = t; else S.tex = t; edit(q => q.t = t); });
  if (a === 'base') return texPicker(b, G.base, t => { snap(); G.base = t; bakeAll(); save(); ui(); });
  if (a === 'up') return move(1);
  if (a === 'down') return move(-1);
  if (a === 'eye') { snap(); return edit(q => q.off = q.off ? undefined : 1); }
  if (a === 'lock') { snap(); s.lock = s.lock ? undefined : 1; save(); }
  if (a === 'dup') { snap(); const c = JSON.parse(JSON.stringify(s)); for (const p of gLines(c)) for (let i = 0; i < p.length; i++) p[i] += 24; G.stamps.splice(sel + 1, 0, c); sel++; dirty(gBox(c)); save(); }
  if (a === 'delv') { snap(); edit(delV); selV = null; }
  if (a === 'del') { snap(); const bb = gBox(s); G.stamps.splice(sel, 1); sel = -1; selV = null; dirty(bb); save(); }
  ui(); draw();
};
$('#btm').addEventListener('click', onBar); $('#ctx').addEventListener('click', onBar);
$('#bMap').onclick = mapMenu; $('#bView').onclick = viewMenu;
$('#bUndo').onclick = () => restore(UNDO, REDO); $('#bRedo').onclick = () => restore(REDO, UNDO);
$('#bZin').onclick = () => zoomAt(1.4, W / 2, H / 2); $('#bZout').onclick = () => zoomAt(1 / 1.4, W / 2, H / 2); $('#bFit').onclick = fit;
addEventListener('keydown', e => {

  if (e.key === 'Delete' && tab !== 'ter' && osel >= 0) { snap(); objs().splice(osel, 1); osel = -1; save(); ui(); draw(); }
  if (e.key === 'Delete' && sel >= 0) { snap(); const bb = gBox(cur()); G.stamps.splice(sel, 1); sel = -1; selV = null; dirty(bb); save(); ui(); draw(); }
  if (e.key === 'Enter' && draft) finishDraft();
  if (e.key === 'Escape') { draft = null; tool = 'select'; sel = -1; selV = null; ui(); draw(); }
});
let tt = 0; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); }
new ResizeObserver(resize).observe($('#wrap'));     // the bottom bar grows and shrinks with the selection: the canvas follows
document.addEventListener('gesturestart', e => e.preventDefault());     // iOS: no page zoom

/* ---------- start: the atlas (textures), then the last map or a new one ---------- */
(async () => {

  open(S.cur);
  try { ATLAS = await (await fetch('../atlas.json')).json(); } catch (e) { }
  let n = 0; const done = () => { if (++n === 2) { GTX.clear(); SWC.clear(); for (const k in PAT) delete PAT[k]; bakeAll(); ui(); } };
  for (const [im, src] of [[IMG, '../atlas.png'], [MIMG, '../atlas_m.png']]) { im.onload = done; im.onerror = done; im.src = src; }
})();
