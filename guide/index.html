<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d120b">
<title>Militia Mayhem Field Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d120b;--bg2:#141b11;--panel:#1a2316;--panel2:#212c1c;--line:#2f3c28;--line2:#3d4d34;
  --ink:#ece4c8;--dim:#a49f86;--faint:#6f725f;--acc:#e0b72c;--acc2:#f5d670;--blue:#4c8dff;--red:#ef5a44;--green:#7ddc6a;--cyan:#5fd3d0;--violet:#b48cff;--orange:#ff9a3c;
  --fd:'Black Ops One',system-ui,sans-serif;--fb:'Chakra Petch',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}
header{padding:calc(8px + var(--safe-t)) 16px 8px;display:flex;align-items:center;gap:10px;background:linear-gradient(#141b11,#0f150d);border-bottom:1px solid var(--line)}
header h1{font-family:var(--fd);font-weight:400;font-size:18px;letter-spacing:.5px;margin:0;line-height:1.1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{display:block;font-family:var(--fb);font-size:11px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
.chip{font-family:var(--fm);font-size:11px;padding:3px 7px;border:1px solid var(--line2);border-radius:20px;color:var(--acc2);white-space:nowrap}
main{position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:#10160e;border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;letter-spacing:1.2px;color:var(--faint);font-weight:600;position:relative}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
nav button.on::before{content:'';position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--acc);border-radius:0 0 2px 2px}
/* toolbars inside views */
.bar{display:flex;gap:8px;padding:10px 16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--bg2)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:7px;font-size:12px;font-weight:600;letter-spacing:.8px;color:var(--dim)}
.seg button.on{background:var(--acc);color:#1b1607}
.hint{font-size:12px;color:var(--dim)}
.grow{flex:1}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;overscroll-behavior:contain}
/* bottom sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:78%;z-index:21;background:var(--panel);border-top:1px solid var(--line2);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:var(--safe-b);max-width:760px;margin:0 auto}
#sheet.on{transform:none}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 2px}
#sheet .sh-head{display:flex;align-items:flex-start;gap:12px;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
#sheet .sh-head h2{margin:0;font-family:var(--fd);font-weight:400;font-size:20px;line-height:1.15}
#sheet .sh-head .sub{font-size:12px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
#sheet .x{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;flex:none}
#sheet .sh-body{padding:12px 16px 20px;overflow-y:auto}
/* full screen page (systems detail) */
#page{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#page.on{transform:none}
#page .pg-head{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 12px 8px;border-bottom:1px solid var(--line);background:var(--bg2)}
#page .back{width:38px;height:38px;border-radius:10px;background:var(--panel);display:grid;place-items:center;flex:none}
#page .pg-head h2{margin:0;font-family:var(--fd);font-weight:400;font-size:19px;line-height:1.1;flex:1;min-width:0}
#page .pg-head h2 small{display:block;font-family:var(--fb);font-size:11px;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase}
#page .pg-nav{display:flex;gap:6px}
#page .pg-nav button{width:38px;height:38px;border-radius:10px;background:var(--panel);display:grid;place-items:center}
#page .pg-body{padding:14px 16px calc(28px + var(--safe-b));max-width:760px;margin:0 auto;width:100%}
/* content blocks */
h3{font-family:var(--fd);font-weight:400;font-size:16px;letter-spacing:.4px;margin:22px 0 8px;color:var(--acc2)}
h3:first-child{margin-top:4px}
p{margin:0 0 10px}
.lead{font-size:15.5px;color:var(--ink)}
.muted{color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px}
.demo{background:#0a0f08;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 12px;position:relative}
.demo canvas{display:block;width:100%;touch-action:none}
.demo .cap{font-size:12px;color:var(--dim);padding:8px 10px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo .ctl{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.btn{background:var(--panel2);border:1px solid var(--line2);padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;letter-spacing:.6px}
.btn.on{background:var(--acc);color:#1b1607;border-color:var(--acc)}
.range{display:flex;align-items:center;gap:8px;width:100%;font-size:12.5px}
.range label{width:92px;color:var(--dim);flex:none}
.range input{flex:1;accent-color:var(--acc);min-width:0}
.range output{font-family:var(--fm);font-size:12px;width:56px;text-align:right;color:var(--acc2);flex:none}
.math{font-family:var(--fm);font-size:12px;background:#0a0f08;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:10px 12px;margin:0 0 12px;white-space:pre-wrap;word-break:break-word;line-height:1.55;color:#f3ecd2}
.math .c{color:var(--faint)}
.math .k{color:var(--cyan)}
.math .n{color:var(--orange)}
table.vars{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 12px}
table.vars td,table.vars th{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
table.vars th{font-size:11px;letter-spacing:1px;color:var(--dim);font-weight:600;text-transform:uppercase}
table.vars td:first-child{font-family:var(--fm);font-size:12px;color:var(--acc2);white-space:nowrap}
table.vars td.v{font-family:var(--fm);font-size:12px;color:var(--cyan);white-space:nowrap}
table.vars td.m{font-size:12.5px;color:var(--dim);padding-top:0;font-family:var(--fb);white-space:normal}
table.vars tr:has(+tr td.m) td{border-bottom:0}
.tw{overflow-x:auto;margin:0 0 12px}.tw table{margin:0}
code,.mono{font-family:var(--fm);font-size:.88em;color:var(--acc2)}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:12px;border:1px solid var(--line2);color:var(--dim);margin:0 4px 4px 0;letter-spacing:.4px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-family:var(--fm);font-size:17px;color:var(--acc2);font-weight:600}
.kv span{font-size:11px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase}
ul.flow{list-style:none;margin:0 0 12px;padding:0;counter-reset:f}
ul.flow li{position:relative;padding:8px 10px 8px 40px;border-left:2px solid var(--line2);margin-left:14px}
ul.flow li::before{counter-increment:f;content:counter(f);position:absolute;left:-14px;top:7px;width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--fm);font-size:12px;color:var(--acc2)}
ul.flow li b{color:var(--ink)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.links button{font-size:12px;padding:5px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2)}
/* map view */
#mapSvg{width:100%;display:block;touch-action:none}
.node rect{fill:var(--panel);stroke:var(--line2);stroke-width:1.2}
.node.hot rect{stroke:var(--acc);stroke-width:2}
.node text{fill:var(--ink);font-family:var(--fb);font-size:11px;font-weight:600;pointer-events:none}
.node text.t{font-family:var(--fd);font-size:12.5px;font-weight:400}
.node text.f{fill:var(--faint);font-family:var(--fm);font-size:8.5px;font-weight:400}
.edge{fill:none;stroke-linecap:round}
.elab{font-family:var(--fb);font-size:9px;font-weight:600;fill:var(--acc2);pointer-events:none;paint-order:stroke;stroke:#0d120b;stroke-width:3px;stroke-linejoin:round}
.grp{font-family:var(--fb);font-size:8px;letter-spacing:1px;fill:var(--faint);font-weight:600}
#mapCard{margin:0 10px 10px;background:rgba(26,35,22,.96);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;display:none;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#mapCard.on{display:flex}
#mapCard b{font-family:var(--fd);font-weight:400;font-size:15px;display:block}
#mapCard span{font-size:12px;color:var(--dim);display:block;line-height:1.3}
/* frame view */
#frameList{padding:8px 0 24px}
.step{display:flex;gap:10px;padding:9px 16px 9px 0;position:relative;align-items:flex-start}
.step .rail{width:46px;flex:none;position:relative;align-self:stretch}
.step .rail::before{content:'';position:absolute;left:23px;top:-9px;bottom:-9px;width:2px;background:var(--line)}
.step .dot{position:absolute;left:16px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--line2);z-index:1;transition:all .15s}
.step.sub .rail::after{content:'';position:absolute;left:24px;top:14px;width:14px;height:2px;background:var(--line)}
.step.sub .dot{left:36px;top:8px;width:11px;height:11px}
.step.sub .bd{padding-left:14px}
.step .bd{flex:1;min-width:0}
.step .nm{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.step .nm code{font-size:12px;font-weight:400}
.step .ds{font-size:12.8px;color:var(--dim);margin-top:2px}
.step .fl{font-family:var(--fm);font-size:10.5px;color:var(--faint);margin-left:auto}
.step.cur .dot{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 5px rgba(224,183,44,.18)}
.step.cur .nm{color:var(--acc2)}
.step.done .dot{border-color:var(--acc);background:#3b3215}
.phase{font-family:var(--fd);font-size:13px;letter-spacing:1px;color:var(--acc);padding:16px 16px 4px 16px}
/* layers view */
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;perspective:900px;perspective-origin:50% 35%}
#stack{position:absolute;left:50%;top:52%;width:0;height:0;transform-style:preserve-3d}
.lay{position:absolute;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.lay canvas{display:block;border-radius:3px}
.lay .tag{position:absolute;left:100%;top:0;margin-left:8px;white-space:nowrap;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--ink);background:rgba(13,18,11,.85);border:1px solid var(--line2);padding:2px 6px;border-radius:6px;transform-origin:left center}
.lay.sel canvas{outline:2px solid var(--acc)}
.lay.dim{opacity:.18}
#layInfo{border-top:1px solid var(--line);background:var(--bg2);padding:10px 16px;min-height:96px;max-height:34%;overflow-y:auto}
#layInfo h4{margin:0 0 2px;font-family:var(--fd);font-weight:400;font-size:15px;color:var(--acc2)}
#layInfo .z{font-family:var(--fm);font-size:11px;color:var(--cyan)}
/* systems grid */
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 16px 24px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:132px;position:relative;overflow:hidden}
.scard canvas{width:100%;height:58px;display:block}
.scard b{font-family:var(--fd);font-weight:400;font-size:14.5px;line-height:1.1}
.scard span{font-size:11.5px;color:var(--dim);line-height:1.3}
.scard i{position:absolute;top:8px;right:9px;font-style:normal;font-family:var(--fm);font-size:10px;color:var(--faint)}
.sec-t{grid-column:1/-1;font-family:var(--fd);font-size:13px;color:var(--acc);letter-spacing:1px;margin:8px 0 -2px}
/* code view */
.mods{padding:10px 16px 24px}
.mod{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;width:100%;text-align:left}
.mod b{font-weight:700}
.mod .meta{font-family:var(--fm);font-size:11px;color:var(--faint)}
.mod .barv{grid-column:1/-1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:4px}
.mod .barv i{display:block;height:100%;background:var(--acc)}
.search{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit;font-size:14px}
.def{padding:10px 16px;border-bottom:1px solid var(--line)}
.def .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.def .h b{font-family:var(--fm);font-size:13.5px;color:var(--acc2);font-weight:600;word-break:break-all}
.def .h .a{font-family:var(--fm);font-size:11.5px;color:var(--faint);word-break:break-all}
.def .h .k{font-size:10px;letter-spacing:1px;color:var(--cyan);border:1px solid var(--line2);border-radius:5px;padding:0 4px}
.def .c{font-size:12.8px;color:var(--dim);margin-top:3px;overflow-wrap:anywhere}
.def .u{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.def .u button{font-family:var(--fm);font-size:11px;padding:2px 6px;border-radius:6px;background:var(--panel2);color:var(--ink)}
.def .u button.x{color:var(--cyan)}
#heat{width:100%;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);padding:0 16px 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
@media (min-width:700px){.sgrid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Militia Mayhem<small>Field manual · how the game runs</small></h1>
    <span class="chip" id="buildChip">BUILD 231</span>
  </header>
  <main>
    <!-- 1 SYSTEM MAP -->
    <section class="view on" id="v-map">
      <div class="bar">
        <div class="seg" id="mapMode"><button class="on" data-m="flow">DATA FLOW</button><button data-m="code">CODE LINKS</button></div>
        <span class="hint grow" id="mapHint">Tap a module</span>
      </div>
      <div style="flex:1;min-height:0;display:flex;flex-direction:column"><svg id="mapSvg" style="flex:1;min-height:0" viewBox="0 0 360 600" preserveAspectRatio="xMidYMid meet"></svg><div id="mapCard"></div></div>
    </section>
    <!-- 2 FRAME -->
    <section class="view" id="v-frame">
      <div class="bar">
        <button class="btn on" id="fPlay">❚❚ PAUSE</button>
        <button class="btn" id="fStep">STEP ›</button>
        <span class="hint grow" style="text-align:right">one frame, start to finish</span>
      </div>
      <div class="scroll" id="frameScroll"><div id="frameList"></div></div>
    </section>
    <!-- 3 LAYERS -->
    <section class="view" id="v-layers">
      <div class="bar">
        <div class="seg" id="layMode"><button class="on" data-m="stack">DRAW STACK</button><button data-m="relief">HEIGHTS</button></div>
        <div class="seg" id="layExp"><button data-e="0">FLAT</button><button class="on" data-e="1">EXPLODE</button></div>
      </div>
      <div id="stage"><div id="stack"></div><button class="btn" id="camR" title="reset view" style="position:absolute;right:10px;top:10px;z-index:2">⟲</button><canvas id="relief" style="position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none"></canvas></div>
      <div id="layInfo"></div>
    </section>
    <!-- 4 SYSTEMS -->
    <section class="view" id="v-sys"><div class="scroll"><div class="sgrid" id="sgrid"></div></div></section>
    <!-- 5 CODE -->
    <section class="view" id="v-code">
      <div class="bar">
        <div class="seg" id="codeMode"><button class="on" data-m="mods">MODULES</button><button data-m="matrix">MATRIX</button><button data-m="find">FIND</button></div>
      </div>
      <div class="scroll" id="codeBody"></div>
    </section>
  </main>
  <nav id="tabs">
    <button class="on" data-v="map"><svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2.4"/><circle cx="19" cy="6" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M7.2 6.8 10.6 16M16.8 6.8 13.4 16M7.4 6h9.2"/></svg>MAP</button>
    <button data-v="frame"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2.2"/></svg>FRAME</button>
    <button data-v="layers"><svg viewBox="0 0 24 24"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>LAYERS</button>
    <button data-v="sys"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>SYSTEMS</button>
    <button data-v="code"><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>CODE</button>
  </nav>
</div>
<div id="scrim"></div>
<div id="sheet"><div class="grab"></div><div class="sh-head"><div><div class="sub" id="shSub"></div><h2 id="shTitle"></h2></div><button class="x" id="shX" aria-label="Close">✕</button></div><div class="sh-body" id="shBody"></div></div>
<div id="page"><div class="pg-head"><button class="back" id="pgBack" aria-label="Back">‹</button><h2 id="pgTitle"></h2><div class="pg-nav"><button id="pgPrev" aria-label="Previous">↑</button><button id="pgNext" aria-label="Next">↓</button></div></div><div class="scroll" id="pgScroll"><div class="pg-body" id="pgBody"></div></div></div>

<script src="data.js"></script>
<script>
/* ============ shared helpers ============ */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const TAU = Math.PI * 2, clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const CSSV = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { acc: '#e0b72c', acc2: '#f5d670', blue: '#4c8dff', red: '#ef5a44', green: '#7ddc6a', cyan: '#5fd3d0', violet: '#b48cff', orange: '#ff9a3c', ink: '#ece4c8', dim: '#a49f86', faint: '#6f725f', line: '#2f3c28', line2: '#3d4d34', panel: '#1a2316', bg: '#0d120b' };
fetch('../version.json?' + Date.now()).then(r => r.json()).then(v => { if (v && v.build) $('#buildChip').textContent = 'BUILD ' + v.build; }).catch(() => { });
/* a canvas sized to its box at device resolution; returns its 2D context with CSS-px units */

  { n: 'draw queue, low → high', f: '5_ui', d: 'Everything on the ground pushed with its height and sorted: bodies, items, crates, soldiers, sandbags, trees, vehicles, shots, roofs.', s: 1 },
  { n: 'the light', f: '5e_light', d: 'Day: drawSun (height buffer → sweep shadows, shading). Night: shader point lights.', s: 1 },
  { n: 'over the light', f: '5_ui', d: 'Fire, flashes, sparks and smoke puffs (glows are added on top so they aren\'t shaded).', s: 1 },
  { n: 'soft fog · lasers · smoke', f: '5b_fog · 3_sim', d: 'Smoke and windows dim what\'s inside sight; the smoke field\'s puffs; the remembered world over what is out of sight.', s: 1 },
  { n: 'tags · reticles · weather · grade', f: '5_ui', d: 'Names, aim reticles, rain / snow, and the grit look (multiply, film grain, vignette).', s: 1 },
  { n: 'HUD on the 2D canvas', f: '5_ui · 6_menus', d: 'Per-view HUD, global HUD, scoreboard, pause, touch controls, dev panel, end screen, FPS, settings.' },
  { n: 'gxFlush', f: '0_gx', d: 'The last batch goes to the GPU.' },
  { ph: 'AFTER' },
  { n: 'devTime · audioTick', f: '5d_dev · 1_core', d: 'Frame timings for the FPS counter; the music scheduler queues notes up to 120 ms ahead.' },
  { n: 'endInputFrame', f: '1_core', d: 'Edge-triggered presses (pressed this frame) are cleared, then the next frame is requested.' }
];
VIEWS.frame = {
  init() {
    const L = $('#frameList'); let html = '', idx = [];
    FRAME.forEach((s, i) => {
      if (s.ph) { html += `<div class="phase">${s.ph}</div>`; return; }
      idx.push(i);
      html += `<div class="step${s.s ? ' sub' : ''}" data-i="${i}"><div class="rail"><div class="dot"></div></div><div class="bd"><div class="nm">${esc(s.n)}<span class="fl">${s.f}</span></div><div class="ds">${esc(s.d)}</div>${s.m ? `<div class="math" style="margin:6px 0 0">${esc(s.m)}</div>` : ''}</div></div>`;
    });
    L.innerHTML = html;
    const steps = $$('#frameList .step'); let cur = 0, play = true, acc = 0;
    const set = k => { cur = (k + steps.length) % steps.length; steps.forEach((e, j) => { e.classList.toggle('cur', j === cur); e.classList.toggle('done', j < cur); }); const e = steps[cur], sc = $('#frameScroll'), r = e.getBoundingClientRect(), R = sc.getBoundingClientRect(); if (r.top < R.top + 40 || r.bottom > R.bottom - 40) sc.scrollTo({ top: sc.scrollTop + r.top - R.top - R.height * 0.35, behavior: 'smooth' }); };
    set(0);
    steps.forEach((e, j) => e.onclick = () => { set(j); setPlay(false); });
    const setPlay = p => { play = p; $('#fPlay').textContent = p ? '❚❚ PAUSE' : '▶ PLAY'; $('#fPlay').classList.toggle('on', p); };
    $('#fPlay').onclick = () => setPlay(!play); $('#fStep').onclick = () => { setPlay(false); set(cur + 1); };
    let last = performance.now();
    (function a(now) { const dt = (now - last) / 1000; last = now; if (play && $('#v-frame').classList.contains('on')) { acc += dt; if (acc > 1.6) { acc = 0; set(cur + 1); } } requestAnimationFrame(a); })(last);
  }
};

/* ============ VIEW 5: code ============ */
VIEWS.code = {
  init() {
    const C = window.GAME_CODE, body = $('#codeBody'), files = Object.keys(C.files), maxL = Math.max(...files.map(f => C.files[f].lines));
    const KIND = ['fn', '=>', 'class', 'var'];
    const defHTML = (n, D) => {
      const [f, k, l, nl, a, c0, inl, calls] = D, c = (c0 || '').replace(/[=\-*_~#]{4,}/g, ' ').replace(/\s+/g, ' ').trim(), cross = calls.filter(x => C.defs[x] && C.defs[x][0] !== f), same = calls.filter(x => C.defs[x] && C.defs[x][0] === f);
      const by = (VIEWS.code.rev[n] || []);
      return `<div class="def" id="d-${esc(n)}"><div class="h"><b>${esc(n)}</b>${k < 3 && a ? `<span class="a">(${esc(a)})</span>` : ''}<span class="k">${KIND[k]}</span><span class="a" style="margin-left:auto">${f}:${l} · ${nl} ln</span></div>${c || inl ? `<div class="c">${esc(c || inl)}${c && inl ? ' <i>— ' + esc(inl) + '</i>' : ''}</div>` : ''}
      ${calls.length || by.length ? `<div class="u">${cross.slice(0, 18).map(x => `<button class="x" data-d="${esc(x)}">${esc(x)}</button>`).join('')}${same.slice(0, 14).map(x => `<button data-d="${esc(x)}">${esc(x)}</button>`).join('')}${by.length ? `<span class="hint" style="width:100%;margin-top:2px">used by ${by.length}: ${by.slice(0, 8).map(esc).join(', ')}${by.length > 8 ? '…' : ''}</span>` : ''}</div>` : ''}</div>`;
    };
    const rev = {}; for (const [n, D] of Object.entries(C.defs)) for (const x of D[7]) (rev[x] || (rev[x] = [])).push(n);
    this.rev = rev;
    const mods = () => {
      body.innerHTML = `<div class="mods"><p class="muted" style="font-size:13px">13 source files, concatenated in this order by <code>build.py</code> into one inline script in <code>index.html</code> (with the atlas PNGs as data URIs). Tap one for its definitions.</p>${files.map(f => { const F = C.files[f]; return `<button class="mod" data-f="${f}"><b><span style="color:${MODS[f].c}">■</span> ${f}.js <span class="muted" style="font-weight:500">· ${MODS[f].t.toLowerCase()}</span></b><span class="meta">${F.lines} ln</span><span class="meta">${F.fns} functions · ${F.vars} values · ${(F.bytes / 1024).toFixed(1)} KB</span><span></span><div class="barv"><i style="width:${F.lines / maxL * 100}%;background:${MODS[f].c}"></i></div></button>`; }).join('')}</div>`;
      body.querySelectorAll('.mod').forEach(b => b.onclick = () => openMod(b.dataset.f));
    };
    const bindDefs = root => root.querySelectorAll('[data-d]').forEach(b => b.onclick = () => showDef(b.dataset.d));
    const openMod = f => {
      setMode('mods', true);
      const list = Object.entries(C.defs).filter(([, D]) => D[0] === f).sort((a, b) => a[1][2] - b[1][2]);
      body.innerHTML = `<div class="bar" style="position:sticky;top:0;z-index:2"><button class="btn" id="cBack">‹ FILES</button><b>${f}.js</b><span class="hint">${list.length} definitions</span></div><p class="muted" style="padding:10px 16px 0;margin:0;font-size:13px">${MODS[f].d}</p><div class="legend" style="padding-top:8px"><span><i style="background:var(--cyan)"></i>uses another file</span><span><i style="background:var(--ink)"></i>same file</span></div>${list.map(([n, D]) => defHTML(n, D)).join('')}`;
      body.scrollTop = 0; $('#cBack').onclick = mods; bindDefs(body);
    };
    const showDef = n => { const D = C.defs[n]; if (!D) return; openSheet(D[0] + '.js · line ' + D[2], n, defHTML(n, D).replace('class="def"', 'class="def" style="padding:0;border:0"'), b => bindDefs(b)); };
    const matrix = () => {
      body.innerHTML = `<div style="padding:12px 16px 4px"><p class="muted" style="font-size:13px;margin:0 0 8px">How many top-level names each file (row) uses from another (column). The core is used by everything; the simulation sits in the middle.</p></div><div style="padding:0 10px"><canvas id="heat"></canvas></div><div class="legend" style="padding-top:8px">tap a cell</div>`;
      const c = $('#heat'), g = fitCanvas(c, Math.min(560, Math.round(c.parentElement.getBoundingClientRect().width * 1.08))), n = files.length, pad = 66, cs = (g.W - pad - 4) / n, M = {}; let mx = 1;
      for (const [a, b, v] of C.edges) { M[a + '|' + b] = v; mx = Math.max(mx, v); }
      g.font = '600 9.5px Chakra Petch'; g.textBaseline = 'middle';
      files.forEach((f, i) => { g.fillStyle = MODS[f].c; g.textAlign = 'right'; g.fillText(f, pad - 6, pad + cs * i + cs / 2); g.save(); g.translate(pad + cs * i + cs / 2, pad - 6); g.rotate(-Math.PI / 2.6); g.textAlign = 'left'; g.fillText(f, 0, 0); g.restore(); });
      files.forEach((a, i) => files.forEach((b, j) => { const v = M[a + '|' + b] || 0, k = Math.sqrt(v / mx); g.fillStyle = i === j ? '#141b11' : v ? `rgba(224,183,44,${0.08 + 0.92 * k})` : '#121810'; g.fillRect(pad + cs * j + 1, pad + cs * i + 1, cs - 2, cs - 2); if (v && cs > 20) { g.fillStyle = k > 0.5 ? '#1b1607' : '#d8cfa8'; g.font = '9px JetBrains Mono'; g.textAlign = 'center'; g.fillText(v, pad + cs * j + cs / 2, pad + cs * i + cs / 2); } }));
      c.onclick = e => { const r = c.getBoundingClientRect(), j = Math.floor((e.clientX - r.left - pad) / cs), i = Math.floor((e.clientY - r.top - pad) / cs); if (i < 0 || j < 0 || i >= n || j >= n || i === j) return; const a = files[i], b = files[j], names = new Set(); for (const [nm, D] of Object.entries(C.defs)) if (D[0] === a) for (const x of D[7]) if (C.defs[x] && C.defs[x][0] === b) names.add(x); openSheet(a + ' → ' + b, (M[a + '|' + b] || 0) + ' references', `<p class="muted">Names from <code>${b}.js</code> that <code>${a}.js</code> uses:</p><div class="def" style="padding:0;border:0"><div class="u">${[...names].sort().map(x => `<button data-d="${esc(x)}">${esc(x)}</button>`).join('') || '—'}</div></div>`, bb => bindDefs(bb)); };
    };
    const find = () => {
      body.innerHTML = `<div class="bar" style="position:sticky;top:0;z-index:2"><input class="search" id="q" placeholder="search ${Object.keys(C.defs).length} names and comments…" autocomplete="off"></div><div id="qr"></div>`;
      const q = $('#q'), run = () => { const s = q.value.trim().toLowerCase(); if (s.length < 2) { $('#qr').innerHTML = '<p class="muted" style="padding:12px 16px">Try <code>sun</code>, <code>smoke</code>, <code>bot</code>, <code>snapshot</code>, <code>explosion</code>…</p>'; return; } const hits = Object.entries(C.defs).map(([n, D]) => [n, D, n.toLowerCase().includes(s) ? 2 : (D[5] + ' ' + D[6]).toLowerCase().includes(s) ? 1 : 0]).filter(h => h[2]).sort((a, b) => b[2] - a[2]).slice(0, 80); $('#qr').innerHTML = hits.map(([n, D]) => defHTML(n, D)).join('') || '<p class="muted" style="padding:12px 16px">nothing</p>'; bindDefs($('#qr')); };
      q.oninput = run; run();
    };
    const setMode = (m, quiet) => { $$('#codeMode button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); if (quiet) return; ({ mods, matrix, find })[m](); };
    $('#codeMode').onclick = e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); };
    this.openMod = openMod; mods();
  },
  openMod(f) { if (!this.done) { this.done = 1; this.init(); } this.openMod(f); }
};
</script>
